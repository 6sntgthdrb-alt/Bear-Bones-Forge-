<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bear Bones Forge">
<meta name="theme-color" content="#111012">
<title>Bear Bones Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&family=UnifrakturCook:wght@700&family=Pirata+One&family=Exo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a one-screen phone app (sticky header with the points bar, scrolling middle, tab bar at the bottom), dressed as a gothic codex: carved serif headings, gold trim, parchment by day and dark stone by night. Inside a list the army takes over colours, banner, texture and lettering. */
:root{
  --bg-b:#ece3cf;
  --panel-b:#f6efdf;
  --panel2-b:#e6dbc2;
  --line-b:#c9b993;
  --text:#2a2219;
  --muted-b:#6f6250;
  --bg:var(--bg-b); --panel:var(--panel-b); --panel2:var(--panel2-b); --line:var(--line-b); --muted:var(--muted-b);
  --r:10px; --r-sm:8px;
  --accent:#8a6a2b;
  --trim:#9c7a32;
  --on-accent:#fff;
  --ok:#2f7a4c;
  --warn:#9a6a0f;
  --err:#a8322b;
  --shade:rgba(60,40,10,.10);
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --army-title:var(--display);
  --army-head:var(--display);
  --tex-opacity:.10;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-b:#121013; --panel-b:#1b181b; --panel2-b:#242024; --line-b:#3a3226; --text:#ece4d4; --muted-b:#a39882;
    --accent:#b8964a; --trim:#c9a75a; --ok:#6cc48e; --warn:#e3b04f; --err:#e56a5f; --shade:rgba(0,0,0,.35); --tex-opacity:.16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-b:#121013; --panel-b:#1b181b; --panel2-b:#242024; --line-b:#3a3226; --text:#ece4d4; --muted-b:#a39882;
  --accent:#b8964a; --trim:#c9a75a; --ok:#6cc48e; --warn:#e3b04f; --err:#e56a5f; --shade:rgba(0,0,0,.35); --tex-opacity:.16;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:1rem/1.45 var(--body);-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),var(--bg));border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font:700 15px var(--display);color:var(--on-accent)}
.brand h1{font-size:1.25rem;flex:1}
.sync{font-size:.75rem;color:var(--muted)}
.pbar{margin-top:8px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.pbar > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pbar.over > i{background:var(--err)}
.pline{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:4px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(90px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:10px 0 8px;font:600 .8rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--err)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45}
.iconbtn{background:none;border:0;padding:6px;color:var(--muted);cursor:pointer;border-radius:6px}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--display);font-weight:600}
label.f > *{text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:400;font-size:1rem;color:var(--text)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.pill.acc{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}

.issues{display:flex;flex-direction:column;gap:6px}
.issue{display:flex;gap:8px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--warn)}
.issue.err{border-left-color:var(--err)}

.sect{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 55%,var(--bg))}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sect-h h3{font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.addbtn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}
.addbtn .muted{margin-left:auto;font-weight:400}
.adddrop{border:1px solid var(--line);border-radius:10px;padding:4px 12px 8px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.adddrop input{margin-top:8px}
.group-h{font:700 .8rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px;display:flex;justify-content:space-between}
.unit{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px}
.unit.has-err{border-left-color:var(--err)}
.unit.warlord{border-left-color:var(--accent)}
.unit-h{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.unit-h .nm{font-weight:600}
.unit-h .pts{font:700 1.05rem var(--display)}
.unit-b{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}

.listitem{display:flex;gap:12px;align-items:center;cursor:pointer}
.listitem .swatch{width:8px;align-self:stretch;border-radius:4px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:92%;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1}
.sheet-c > *{flex-shrink:0}
.sheet-c{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}

.ds-stats{width:100%;border-collapse:collapse;text-align:center}
.ds-stats th{font:600 .75rem var(--display);letter-spacing:.08em;color:var(--muted);padding:4px 2px}
.ds-stats td{font:700 1.15rem var(--display);padding:6px 2px;background:var(--panel2);border:2px solid var(--bg)}
.ds-stats td.mn{font:500 .85rem var(--body);text-align:left;padding-left:8px}
.tblwrap{overflow-x:auto}
.wg{width:100%;border-collapse:collapse;font-size:.84rem}
.wg th{font:600 .72rem var(--display);letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.wg th:first-child{text-align:left}
.wg td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.wg td:first-child{text-align:left}
.wg .kws{display:block;font-size:.78rem;color:var(--accent);font-weight:600}
.sec-h{font:700 .82rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.rich{font-size:.92rem}
.rich p{margin:.3em 0}
.rich ul{margin:.3em 0;padding-left:1.2em}
.rich table{border-collapse:collapse;font-size:.85rem}
.rich td,.rich th{border:1px solid var(--line);padding:3px 5px}
.ab{padding:8px 0;border-bottom:1px solid var(--line)}
.ab:last-child{border-bottom:0}
.ab b.n{font-family:var(--display);font-size:1.02rem;letter-spacing:.02em}
.strat{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.strat .cp{font:700 1.1rem var(--display);color:var(--accent);min-width:40px;text-align:right}

.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 10px;font:600 .9rem var(--display);letter-spacing:.04em;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.picker-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.picker-row .nm{flex:1;min-width:0;cursor:pointer}
.picker-row .nm small{display:block;color:var(--muted)}

.tracker{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.tracker .hd{font:700 .8rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.tracker input{text-align:center;padding:7px 4px}
.big{font:700 2.2rem var(--display);text-align:center;line-height:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:1.3rem;line-height:1}

.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:6px}
.mcard{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:0 12px}
.mcard summary{cursor:pointer;padding:10px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mcard[open]{padding-bottom:10px}
.mcard .kind{font:700 .7rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.cb-fl{font-style:italic;color:var(--muted);font-size:.88rem;margin-bottom:6px}
.cb-h{font:700 .78rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:10px}
.cb-when{font-size:.9rem;margin:3px 0}
.cb-p{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;font-size:.92rem;margin:4px 0}
.cb-li{padding-left:10px}
.cb-or{text-align:center;font:700 .75rem var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:4px 0}
.vp{flex:none;font:700 .85rem var(--display);background:var(--accent);color:var(--on-accent);border-radius:6px;padding:2px 7px;text-align:center;max-width:46%}
.map{margin:0}.map img{width:100%;border-radius:8px;display:block}.map figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
.actcard{display:flex;flex-direction:column;gap:6px}
details.card > summary{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;z-index:30;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.filelinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;font-size:.88rem}
.credit{font-size:.78rem;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Gothic codex layer ===== */
body{position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--tex-opacity);background:var(--tex,none)}
h1,h2,h3{font-weight:600}
.brand h1{font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase}
.brand .mark{border-radius:3px;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--trim);font-family:var(--display)}
header.top{border-bottom:1px solid var(--trim);box-shadow:0 1px 0 var(--shade)}
.card,.unit,.sect,.strat,.mcard{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trim) 18%,transparent),0 1px 2px var(--shade)}
.card,.sect{border-color:var(--line)}
.sect-h h3{font-family:var(--army-head);display:flex;align-items:center;gap:10px}
.sect-h h3::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--trim);flex:none}
.sec-h,.cb-h,.group-h{font-family:var(--display);letter-spacing:.1em}
.sec-h{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--trim) 45%,transparent)}
.btn.primary{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trim) 60%,transparent)}
.addbtn{border-color:color-mix(in srgb,var(--trim) 55%,var(--line));font-family:var(--body)}
nav.tabs{border-top:1px solid var(--trim)}
nav.tabs button{font-family:var(--display);letter-spacing:.08em;font-size:.72rem}
.unit-h .pts,.big{font-family:var(--display)}
.pill.acc{box-shadow:inset 0 0 0 1px var(--trim)}
.listitem h3{font-family:var(--army-head)}
/* Army banner */
.banner{position:relative;overflow:hidden;border-radius:12px;padding:16px 14px;display:flex;gap:14px;align-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));box-shadow:inset 0 0 0 1px var(--trim),inset 0 0 0 4px color-mix(in srgb,#000 25%,transparent),0 2px 8px var(--shade)}
.banner::after{content:"";position:absolute;inset:0;background:var(--banner-pat,none);opacity:.22;pointer-events:none}
.banner svg{width:64px;height:64px;flex:none;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.banner .bt{position:relative;z-index:1;min-width:0}
.banner .b-alleg{font:600 .7rem var(--display);letter-spacing:.18em;text-transform:uppercase;opacity:.85;color:var(--trim)}
.banner .b-title{font-family:var(--army-title);font-size:2rem;line-height:1.05;margin:2px 0;text-shadow:0 2px 3px rgba(0,0,0,.45);overflow-wrap:anywhere}
.banner .b-sub{font-size:.9rem;opacity:.9}
body[data-alleg="xenos"] .banner .b-title{text-transform:uppercase;letter-spacing:.06em;font-size:1.6rem}
body[data-alleg="chaos"] .banner .b-title{letter-spacing:.03em}
.lemb{width:46px;height:46px;flex:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));display:grid;place-items:center}
.lemb svg{width:38px;height:38px}
.cicon{width:100%;height:100%;object-fit:contain;display:block}
.banner .cicon{width:64px;height:64px;flex:none;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.lemb .cicon{width:38px;height:38px}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
.iconcell{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.iconcell .lemb{width:40px;height:40px}.iconcell .lemb svg,.iconcell .lemb .cicon{width:32px;height:32px}
.wgbox{display:flex;flex-direction:column;gap:8px}
.wgpill{font-weight:500;color:var(--muted)}
.wgf{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:8px}
.fcard{position:relative;height:96px;border-radius:8px;border:1px solid color-mix(in srgb,var(--accent) 60%,#000);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:10px;text-align:left;cursor:pointer;overflow:hidden;box-shadow:inset 0 -50px 40px -10px rgba(0,0,0,.6)}
.fcard:hover,.fcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fcard .fname{font:700 1rem var(--display);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8);letter-spacing:.02em}
.fcard .fcount{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000}
.banner{--accent:var(--army-acc,var(--style-acc));background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 85%,transparent),color-mix(in srgb,var(--accent) 25%,transparent)),var(--scene,none) center/cover,var(--accent) !important}
.hint{color:var(--accent)}
.attach-h{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding-top:8px;border-top:2px solid var(--trim);margin-top:4px}
.mcard.attached{border-color:var(--trim)}
.phases{display:flex;gap:4px}
.phases button{flex:1 1 auto;padding-left:4px !important;padding-right:4px !important}
.phases button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 1px;font:700 .68rem var(--body);letter-spacing:.01em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.phases button[aria-pressed="true"]{background:var(--accent);border-color:var(--trim);color:var(--on-accent)}
.cpb{font:700 .8rem var(--display);background:var(--accent);color:var(--on-accent);border-radius:5px;padding:1px 6px}
.battle{border-color:var(--trim)}
.delbtn{align-self:flex-start;color:var(--muted)}
.delbtn:hover,.delbtn:focus-visible{color:var(--err)}
.delask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--err) 12%,var(--panel2));border:1px solid color-mix(in srgb,var(--err) 45%,transparent);font-size:.9rem}
.delask span{flex:1;min-width:140px}
.btn.danger-solid{background:var(--err);border-color:var(--err);color:#fff}
.banner.custom{background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.15) 70%,rgba(0,0,0,0)),var(--scene) center/cover,var(--accent) !important}
.banner.custom::after{display:none}
.detgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.detbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trim) 15%,transparent)}
.detbox.sel{border-color:var(--trim);box-shadow:0 0 0 1px var(--trim)}
.detbox h3{font-size:1.05rem}
.dr-name{font-weight:700;margin-bottom:2px}
.dsub > summary{cursor:pointer;font:600 .78rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-top:1px solid var(--line)}

function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const nl = text.indexOf("\n");
  if (nl < 0) return [];
  let headerLine = text.slice(0, nl).replace(/\r$/,"");
  const trailing = headerLine.endsWith("|");
  const headers = headerLine.split("|").map(h => h.trim().toLowerCase());
  if (trailing) headers.pop();
  const n = headers.length, rows = [];
  const body = text.slice(nl+1);
  if (trailing) {
    const tok = body.split("|");
    let i = 0;
    while (i + n <= tok.length) {
      const f = tok.slice(i, i+n);
      f[0] = f[0].replace(/^[\r\n]+/, "");
      if (!(n === 1 ? f[0] : f.join("")).trim() && i + n >= tok.length - 1) break;
      const o = {}; headers.forEach((h,k) => o[h] = (f[k]||"").trim()); rows.push(o);
      i += n;
    }
  } else {
    body.split(/\r?\n/).forEach(line => {
      if (!line.trim()) return;
      const f = line.split("|"); const o = {}; headers.forEach((h,k) => o[h] = (f[k]||"").trim()); rows.push(o);
    });
  }
  return rows;
}

/* ============ import a list from text ============ */
const PTS_RE = /(\d{2,4})\s*(?:pts?|points?)\b/i;
const lc = t => String(t||"").toLowerCase().replace(/[’‘]/g, "'");
function unitLinesFor(army, lines){
  const names = Object.keys(D.ds).filter(id => eligible(id, army)).map(id => ({ id, n: lc(D.ds[id].name) })).sort((a,b) => b.n.length - a.n.length);
  const hits = [];
  lines.forEach((line, i) => {
    const m = line.match(PTS_RE) || line.match(/\[(\d{2,4})\]/); if (!m) return;
    if (/strike force|incursion|onslaught|combat patrol/i.test(line)) return;

    const f = names.find(x => { const k = before.indexOf(x.n); return k >= 0 && !/[a-z]/.test(before[k + x.n.length] || " ") && !/[a-z]/.test(before[k-1] || " "); });

  let best = null;

    const hits = unitLinesFor(o.key, lines);
    let score = hits.length * 10 + (T.includes(lc(o.name)) ? 5 : 0) + (o.key === "SM" ? -1 : 0);
    if (!best || score > best.score) best = { army:o.key, hits, score };
  });
  if (!best || !best.hits.length) return null;
  const { army, hits } = best;
  const det = detachmentsFor(army).filter(d => T.includes(lc(d.name))).sort((a,b) => b.name.length - a.name.length)[0] || null;
  const enhs = det ? detEnh(army, det) : D.enh.filter(e => e.faction_id === fidOf(army));
  const sz = text.match(/^\s*(Incursion|Strike Force|Onslaught)\b\s*(?:\(|$)/im);
  let points = sz ? ({ incursion:1000, "strike force":2000, onslaught:3000 })[sz[1].toLowerCase()] : 2000;
  const title = lines.map(x => x.trim()).find(x => x && !/^(\+|=|-)+$/.test(x)) || "";

    const block = lines.slice(h.i + 1, n + 1 < hits.length ? hits[n+1].i : lines.length).filter(x => x.trim() && !/^[A-Z][A-Z &]+$/.test(x.trim()) && !/built with (?:list forge|bear bones forge)|exported with|data version/i.test(x) && !PTS_RE.test(x));
    const all = lc(lines[h.i] + "\n" + block.join("\n"));
    const u = { uid:uid(), ds:h.id, name:D.ds[h.id].name, line:null, enh:null, warlord:/\bwarlord\b/.test(all), lead:null, opts:[], wg:{}, notes:"" };
    const e = enhs.filter(x => all.includes(lc(x.name))).sort((a,b) => b.name.length - a.name.length)[0];
    if (e) { u.enh = e.id; if (!det) u._det = e; }
    const rows = costRows(h.id);
    const sizeM = all.match(/(\d+)\s*models?/);
    const byPts = rows.find(r => r.cost === h.pts - (e ? num(e.cost) : 0)) || rows.find(r => r.cost === h.pts);
    const bySize = sizeM && rows.find(r => parseInt(plain(r.label)) === +sizeM[1]);
    u.line = (byPts || bySize || rows[0] || {}).line || null;
    const stems = new Set((D.wg[h.id]||[]).map(w => wStem(w.name)).filter(Boolean));
    const blockStems = stemsIn(block.join(" ; "), stems);
    optsOf(h.id).forEach(o => { if (!o.choices.length) return;
      const keep = o.keep ? stemsIn(o.keep, stems) : new Set();
      const idx = o.choices.findIndex(c => [...stemsIn(c, stems)].some(st => blockStems.has(st) && !keep.has(st)));
      if (idx >= 0) u.wg[o.line] = idx + 1; });
    const lead = all.match(/leading:\s*(.+)/); if (lead) u._lead = lead[1].trim();
    const extra = block.map(x => x.replace(/^[\s•\-–*◦]+/, "").trim()).filter(x => x && !/^warlord$/i.test(x) && !/^enhancement/i.test(x) && !/^leading:/i.test(x));

    return u;
  });
  const detFromEnh = !det && units.find(u => u._det);
  const det2 = det || (detFromEnh ? detachmentsFor(army).find(d => matchDet(units.find(u => u._det)._det, d)) : null);
  const l = { id:uid(), name:(title.replace(PTS_RE, "").replace(/[()\[\]+]/g, "").trim() || armyName(army) + " import").slice(0, 60), army, armyName:armyName(army), points, det:det2 || null, units, created:Date.now(), updated:Date.now() };
  units.forEach(u => { if (u._lead) { const t = units.find(x => x !== u && lc(unitLabel(l, x)) === lc(u._lead)) || units.find(x => x !== u && lc(u._lead).startsWith(lc(D.ds[x.ds].name))); if (t && (D.lead[u.ds]||[]).includes(t.ds)) u.lead = t.uid; } delete u._lead; delete u._det; });
  const wl = units.filter(u => u.warlord); wl.slice(1).forEach(u => u.warlord = false);
  const total = units.reduce((a,u) => a + unitCost(u) + enhCost(u), 0);
  if (total > l.points && total <= 3000 && !sz) l.points = total > 2000 ? 3000 : 2000;
  const used = new Set(hits.map(h => h.i));
  const missed = lines.filter((x, i) => !used.has(i) && (x.match(PTS_RE) || x.match(/\[(\d{2,4})\]/)) && !/strike force|incursion|onslaught|combat patrol/i.test(x) && i > 0).map(x => x.trim()).filter(x => !/^\S.*\(\d+\s*points?\)$/i.test(x) || unitLinesFor(army,[x]).length === 0).slice(0, 12);

}

/* ============ list logic ============ */
function newList(army){
  const l = { id:uid(), name:`${armyName(army)} ${S.lists.filter(x=>x.army===army).length+1}`, army, armyName:armyName(army), points:2000, det:null, units:[], created:Date.now(), updated:Date.now() };
  S.lists.unshift(l); S.cur = l.id; LS.set("cur", S.cur); saveList(l, true); return l;
}
function unitCost(u){
  const rows = costRows(u.ds); if (!rows.length) return 0;
  return (rows.find(r => r.line === u.line) || rows[0]).cost;
}
const enhCost = u => u.enh && D.enhById[u.enh] ? num(D.enhById[u.enh].cost) : 0;
function unitLabel(l, u){
  const same = l.units.filter(x => x.ds === u.ds);

  return same.length > 1 ? `${nm} #${same.indexOf(u)+1}` : nm;
}
function validate(l){
  const res = { total:0, errors:[], warnings:[], unitErr:{} };

  const bad = (u, msg, err=true) => { (err ? res.errors : res.warnings).push(msg); if (u && err) res.unitErr[u.uid] = true; };
  l.units.forEach(u => { res.total += unitCost(u) + enhCost(u); });
  if (res.total > l.points) bad(null, `Over the points limit by ${res.total - l.points} pts.`);
  if (!l.det) bad(null, "Pick a detachment.", false);
  const counts = {};
  l.units.forEach(u => counts[u.ds] = (counts[u.ds]||0)+1);
  for (const id in counts) {
    const mx = maxOf(id);
    if (counts[id] > mx) l.units.filter(u => u.ds === id).forEach((u,i) => { if (i >= mx) res.unitErr[u.uid] = true; }),
      res.errors.push(`${D.ds[id]?.name||"Unit"}: ${counts[id]} taken, maximum is ${mx}${mx===1?" (Epic Hero)":""}.`);
  }
  l.units.forEach(u => {
    if (!D.ds[u.ds]) bad(u, `"${u.name||"A unit"}" isn't in the imported data any more. Remove it or re-import.`);
    else if (!eligible(u.ds, l.army)) bad(u, `${D.ds[u.ds].name} can't be taken in a ${armyName(l.army, l)} army.`);
    if (D.ds[u.ds] && !costRows(u.ds).length) bad(u, `${D.ds[u.ds].name} has no points in the data.`, false);
  });
  const enhUnits = l.units.filter(u => u.enh);
  if (enhUnits.length > 3) bad(null, `${enhUnits.length} enhancements taken, maximum is 3.`);
  const seen = {};
  enhUnits.forEach(u => {
    const e = D.enhById[u.enh], k = D.kwSet[u.ds] || new Set();
    if (!e) { bad(u, `${unitLabel(l,u)} has an enhancement that isn't in the data.`); return; }
    if (seen[u.enh]) bad(u, `${e.name} is taken more than once.`);
    seen[u.enh] = true;
    if (!k.has("CHARACTER")) bad(u, `${unitLabel(l,u)} isn't a Character, so it can't take ${e.name}.`);
    if (k.has("EPIC HERO")) bad(u, `${unitLabel(l,u)} is an Epic Hero, so it can't take an enhancement.`);
    if (l.det && !matchDet(e, l.det)) bad(u, `${e.name} isn't from the ${l.det.name} detachment.`);
    const allow = D.enhDs[u.enh]; if (allow && allow.size && !allow.has(u.ds)) bad(u, `${unitLabel(l,u)} isn't allowed to take ${e.name}.`);
  });
  const leg = l.units.filter(u => D.ds[u.ds] && isLegends(u.ds));
  if (leg.length) res.warnings.push(`This list includes Legends units (${[...new Set(leg.map(u => D.ds[u.ds].name))].join(", ")}). They aren't allowed in most matched play events, so check with your opponent.`);
  const wl = l.units.filter(u => u.warlord);
  if (!wl.length && l.units.some(u => D.kwSet[u.ds]?.has("CHARACTER"))) bad(null, "Choose a Warlord.", false);
  if (wl.length > 1) bad(wl[1], "Only one model can be your Warlord.");
  wl.forEach(u => { if (!D.kwSet[u.ds]?.has("CHARACTER")) bad(u, `${unitLabel(l,u)} isn't a Character, so it can't be your Warlord.`); });
  const leaders = {};
  l.units.forEach(u => {
    if (!u.lead) return;
    const tgt = l.units.find(x => x.uid === u.lead);
    if (!tgt) { u.lead = null; return; }
    if (!(D.lead[u.ds]||[]).includes(tgt.ds)) bad(u, `${unitLabel(l,u)} can't lead ${unitLabel(l,tgt)}.`);
    (leaders[tgt.uid] ||= []).push(u);
  });
  for (const t in leaders) if (leaders[t].length > 1) {
    const tgt = l.units.find(x => x.uid === t);
    res.warnings.push(`${unitLabel(l,tgt)} has ${leaders[t].length} Leaders attached. Only some datasheets allow this, so check their Leader rules.`);
  }
  return res;
}
function listText(l){
  const v = validate(l), out = [];

  out.push(`${l.name}`);
  out.push(`${armyName(l.army, l)}${l.det ? " · " + l.det.name : ""}`);
  out.push(`${sz ? sz.name + " " : ""}(${l.points} pts) · ${v.total} pts used`);

const turnTag = t => { const x = lc(t); return x.startsWith("your") ? `<span class="tag t-you">Your turn</span>` : x.startsWith("opponent") ? `<span class="tag t-opp">Opp. turn</span>` : `<span class="tag t-either">Either turn</span>`; };
const phaseTag = p => { const x = String(p||"").replace(/ phase$/i, "").replace(/Shooting/g, "Shoot").replace(/ or /g, " / "); return x ? `<span class="tag">${esc(x)}</span>` : ""; };
function stratRow(s){
  return `<details class="srow t-${lc(s.turn).startsWith("your") ? "you" : lc(s.turn).startsWith("opponent") ? "opp" : "either"}"><summary><span class="sname">${esc(s.name.toLowerCase().replace(/\b\w+/g, (w, i) => i > 0 && /^(of|the|and|for|in|on|to|a|an)$/.test(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)))}</span><span class="cpbox">${esc(s.cp_cost)} CP</span><span class="tags">${turnTag(s.turn)}${phaseTag(s.phase)}</span></summary>
    <div class="rich">${sanitize(s.description)}</div></details>`;
}
function detBox(army, d, l, compact){

    <details class="dsub"><summary>Enhancements · ${enh.length}</summary>${enh.map(e => `<details class="srow"><summary><span class="sname">${esc(e.name)}</span><span class="cpbox">${num(e.cost)} pts</span></summary><div class="rich">${sanitize(e.description)}</div></details>`).join("") || `<div class="small muted">None.</div>`}</details>

}

/* Search: a unit matches by name, or by the name/text of its abilities, weapon abilities and keywords. Returns null (no match), "" (name match) or a hint. */
const searchIdx = {};
function dsSearchText(id){
  if (searchIdx[id]) return searchIdx[id];
  const ab = (D.abil[id]||[]).map(a => { const g = a.ability_id && D.abilities[a.ability_id]; return { n: a.name || (g && g.name) || "", t: plain(a.description || (g && g.description) || "") }; });
  (D.wg[id]||[]).forEach(w => { if (w.description) ab.push({ n: plain(w.description), t: "" }); });
  (D.kw[id]||[]).forEach(k => ab.push({ n: k.keyword, t: "" }));
  return (searchIdx[id] = ab.map(a => ({ n: a.n, nl: lc(a.n), tl: lc(a.t) })));
}
function dsMatch(id, q){
  if (!q) return "";
  if (lc(D.ds[id].name).includes(q)) return "";
  const xs = dsSearchText(id);
  const a = xs.find(x => x.nl.includes(q)) || xs.find(x => x.tl.includes(q));
  return a ? a.n : null;
}
function searchIds(army, q, role){
  q = lc(q).trim(); const hints = {};
  const ids = Object.keys(D.ds).filter(id => eligible(id, army) && (!role || roleOf(id) === role)).filter(id => { const m = dsMatch(id, q); if (m === null) return false; if (m) hints[id] = m; return true; })
    .sort((a,b) => (!!hints[a] - !!hints[b]) || D.ds[a].name.localeCompare(D.ds[b].name));
  return { ids, hints };
}
function dsRows(ids, addable, hints = {}){
  if (!ids.length) return `<div class="muted" style="padding:12px 0">No datasheets match.</div>`;
  const l = curList();
  return ids.map(id => {
    const c = costRows(id); const min = c.length ? Math.min(...c.map(x=>x.cost)) : null;
    const taken = l ? l.units.filter(u => u.ds === id).length : 0, mx = maxOf(id);
    return `<div class="picker-row"><div class="nm" data-act="ds" data-id="${id}" role="button" tabindex="0">${esc(D.ds[id].name)}${isLegends(id) ? ` <span class="pill legend">Legends</span>` : ""}<small>${min!==null?min+" pts":"No points"}${c.length>1?"+":""}${addable && taken?` · ${taken}/${mx} taken`:""}${hints[id] ? ` · <span class="hint">has ${esc(hints[id].length > 40 ? hints[id].slice(0,38) + "…" : hints[id])}</span>` : ""}</small></div>
      ${addable ? `<button class="btn small${taken>=mx?"":" primary"}" data-act="add" data-id="${id}" aria-label="Add ${esc(D.ds[id].name)}"${taken>=mx?" disabled":""}>Add</button>` : SVG.chev}</div>`;
  }).join("");
}

/* ---- Datasheet sheet ---- */
/* Which weapons a unit in a list actually has: its default loadout plus the swaps picked on the Build tab. */
const wStem = n => plain(n).toLowerCase().replace(/^[^a-z0-9]+/, "").replace(/[’‘]/g, "'").split(/\s+[–—-]\s+/)[0].replace(/^\d+\s+/, "").trim();
function stemsIn(text, stems){
  let t = " " + plain(text).toLowerCase().replace(/[’‘]/g, "'") + " "; const found = new Set();
  [...stems].sort((a,b) => b.length - a.length).forEach(st => {
    const re = new RegExp("(^|[^a-z])" + st.replace(/s$/, "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "s?(?=[^a-z]|$)", "g");
    if (re.test(t)) { found.add(st); t = t.replace(re, m => m.replace(/[a-z']/g, " ")); }
  });
  return found;
}
function unitWeapons(u){
  const id = u.ds, d = D.ds[id]; if (!d) return null;
  const stems = new Set((D.wg[id]||[]).map(w => wStem(w.name)).filter(Boolean)); if (!stems.size) return null;
  const have = stemsIn([d.loadout, ...(D.comp[id]||[]).map(c => c.description)].join(" ; "), stems);
  const rows = costRows(id), r = rows.find(x => x.line === u.line) || rows[0];
  const single = r && /^1 model/i.test(plain(r.label));
  wgPicks(u).forEach(p => {
    const o = p.o, keep = o.keep ? stemsIn(o.keep, stems) : new Set();
    if (o.choices.length) {
      stemsIn(p.short, stems).forEach(x => have.add(x));
      if (single || /^(all|every|each) models?/i.test(o.subject)) keep.forEach(x => { if (!stemsIn(p.short, stems).has(x)) have.delete(x); });
    } else {
      const after = o.text.split(/replaced with|equipped with|have/i).slice(1).join(" ");
      stemsIn(after || o.text, stems).forEach(x => have.add(x));
      if (/^all models/i.test(o.text) || single) keep.forEach(x => have.delete(x));
    }
  });
  return have.size ? have : null;
}
function dsBody(id, opt = {}){
  const d = D.ds[id]; if (!d) return "";
  const models = D.models[id] || [], ab = D.abil[id] || [], k = D.kw[id] || [];
  const wg = (D.wg[id] || []).filter(w => !opt.weapons || opt.weapons.has(wStem(w.name)));
  const stats = models.length ? `<div class="tblwrap"><table class="ds-stats"><thead><tr>${models.length>1?"<th></th>":""}<th>M</th><th>T</th><th>SV</th><th>W</th><th>LD</th><th>OC</th></tr></thead><tbody>${models.map(m => `<tr>${models.length>1?`<td class="mn">${esc(m.name)}</td>`:""}<td>${esc(m.m)}</td><td>${esc(m.t)}</td><td>${esc(m.sv)}</td><td>${esc(m.w)}</td><td>${esc(m.ld)}</td><td>${esc(m.oc)}</td></tr>`).join("")}</tbody></table></div>
    ${models.filter(m => m.inv_sv && m.inv_sv !== "-").map(m => `<div class="small"><b>Invulnerable save ${esc(/^\d$/.test(m.inv_sv) ? m.inv_sv + "+" : m.inv_sv)}</b>${models.length>1?` (${esc(m.name)})`:""}${m.inv_sv_descr?` · <span class="rich">${sanitize(m.inv_sv_descr)}</span>`:""}</div>`).join("")}` : "";
  const wtable = type => {
    const rows = wg.filter(w => (w.type||"").toLowerCase().startsWith(type));
    if (!rows.length) return "";
    return `<div><div class="sec-h">${type==="ranged"?"Ranged weapons":"Melee weapons"}</div><div class="tblwrap"><table class="wg"><thead><tr><th>Weapon</th><th>Range</th><th>A</th><th>${type==="ranged"?"BS":"WS"}</th><th>S</th><th>AP</th><th>D</th></tr></thead><tbody>${rows.map(w => `<tr><td>${esc(w.name)}${w.description?`<span class="kws">${plain(w.description).split(/\s*,\s*/).filter(Boolean).map(k => ruleFor(k) ? `<button class="kwbtn" data-act="rule" data-k="${esc(k)}">${esc(k)}</button>` : esc(k)).join(", ")}</span>`:""}</td><td>${esc(/^\d+$/.test(w.range) ? w.range + '"' : (w.range||"Melee"))}</td><td>${esc(w.a)}</td><td>${esc(/^\d$/.test(w.bs_ws) ? w.bs_ws + "+" : w.bs_ws)}</td><td>${esc(w.s)}</td><td>${esc(w.ap)}</td><td>${esc(w.d)}</td></tr>`).join("")}</tbody></table></div></div>`;
  };
  const resolved = ab.map(a => { const g = a.ability_id && D.abilities[a.ability_id]; return { type:a.type||"", name:a.name || (g && g.name) || "", desc:a.description || (g && g.description) || "", param:a.parameter||"", model:a.model||"" }; });
  const core = resolved.filter(a => /core|faction/i.test(a.type) && !/datasheet/i.test(a.type));
  const other = resolved.filter(a => !core.includes(a));
  const costs = costRows(id);
  const la = curList() ? curList().army : null;
  const leads = [...new Set((D.lead[id]||[]).filter(x => !la || eligible(x, la)).map(x => D.ds[x]?.name).filter(Boolean))];
  const html = `
    ${stats}
    ${wtable("ranged")}${wtable("melee")}
    <div><div class="sec-h">Abilities</div>
      ${core.length ? `<div class="chips" style="margin-bottom:6px">${core.map(a => ruleFor(a.name) ? `<button class="pill kwpill" data-act="rule" data-k="${esc(a.name)}">${esc(a.type)}: ${esc(a.name)}${a.param?" "+esc(a.param):""}</button>` : `<span class="pill">${esc(a.type)}: ${esc(a.name)}${a.param?" "+esc(a.param):""}</span>`).join("")}</div>` : ""}
      ${other.map(a => `<div class="ab"><b class="n">${esc(a.name)}</b>${a.param?` <span class="muted">${esc(a.param)}</span>`:""}${/^wargear/i.test(a.type)?` <span class="small muted">(Wargear)</span>`:""}<div class="rich">${sanitize(a.desc)}</div></div>`).join("")}
    </div>
    ${d.damaged_w ? `<div class="card"><div class="sec-h">Damaged: ${esc(d.damaged_w)} wounds remaining</div><div class="rich">${sanitize(d.damaged_description)}</div></div>` : ""}
    ${leads.length || d.leader_head ? `<div><div class="sec-h">Leader</div>${d.leader_head?`<div class="rich">${sanitize(d.leader_head)}</div>`:""}${leads.length?`<ul class="rich">${leads.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}${d.leader_footer?`<div class="rich">${sanitize(d.leader_footer)}</div>`:""}</div>` : ""}
    ${(D.comp[id]||[]).length ? `<div><div class="sec-h">Unit composition</div>${D.comp[id].map(c => `<div class="rich">${sanitize(c.description)}</div>`).join("")}${d.loadout?`<div class="rich">${sanitize(d.loadout)}</div>`:""}</div>` : ""}
    ${opt.compact ? "" : `${(D.opts[id]||[]).length ? `<div><div class="sec-h">Wargear options</div><ul class="rich">${D.opts[id].map(o => `<li>${sanitize(o.description)}</li>`).join("")}</ul></div>` : ""}
    `}${d.transport ? `<div><div class="sec-h">Transport</div><div class="rich">${sanitize(d.transport)}</div></div>` : ""}
    ${opt.compact ? "" : `<div><div class="sec-h">Points</div>${costs.length ? costs.map(c => `<div class="row"><span class="grow rich">${sanitize(c.label)}</span><b class="num">${c.cost} pts</b></div>`).join("") : `<div class="muted">No points in the data.</div>`}</div>`}
    <div><div class="sec-h">Keywords</div><div class="small">${esc(k.filter(x => String(x.is_faction_keyword).toLowerCase()!=="true").map(x=>x.keyword).join(", "))}</div>
      <div class="small muted">Faction: ${esc(k.filter(x => String(x.is_faction_keyword).toLowerCase()==="true").map(x=>x.keyword).join(", "))}</div></div>

function cardVPs(c, mode){

    parts.forEach(x => { if (mode && /fixed|tactical/i.test(x) && !new RegExp(mode, "i").test(x)) return; (x.replace(/\(.*?\)/g, "").match(/\+?(\d+)VP/g)||[]).forEach(m => vals.add(parseInt(m.replace(/\D/g, "")))); }); });

}

function gameAction(t){

  if (act === "gsize") { g.size = t.dataset.v; g.dep = ""; g.pri = ""; }
  else if (act === "grandom") { g.dep = pick(depList(g)).name; g.pri = pick(primList(g)).name; }
  else if (act === "gmode") { g.ps[+t.dataset.p].mode = t.dataset.v; }
  else if (act === "gsec") {
    const p = +t.dataset.p, ps = g.ps[p], n = t.dataset.n, op = t.dataset.op;
    const remove = () => { ps.active = ps.active.filter(x => x !== n); };
    if (op === "draw") {
      if (!ps.deck.length && !ps.active.length && !ps.done.length && !ps.gone.length) ps.deck = shuffle(M.secondaries.map(c => c.name));
      while (ps.active.length < 2 && ps.deck.length) ps.active.push(ps.deck.shift());
    } else if (op === "done" || op === "score") { openScore(p, n, op === "done"); return; }
    else if (op === "discard") { remove(); ps.gone.push(n); }
    else if (op === "neworders") {
      if (g.cp[p] < 1) { toast("Not enough CP for New Orders."); return; }
      g.cp[p]--; remove(); ps.gone.push(n); if (ps.deck.length) ps.active.push(ps.deck.shift());
    } else if (op === "reset") { g.ps[p] = { ...blankPlayerSec(), mode: ps.mode, fixed: ps.fixed }; }
  }
  saveGame(); render();
}

/* ============ import ============ */
async function importFiles(files){
  S.dataNote = "Reading files…"; render();
  const jsons = files.filter(f => /\.json$/i.test(f.name));
  let msNote = "";
  for (const f of jsons) {
    try {
      const m = JSON.parse(await f.text());
      if (m.format === "listforge-backup") { msNote += importBackup(m) + " "; continue; }
      if (m.format === "listforge-glossary") { m.importedAt = Date.now(); G = m; const js = JSON.stringify(m); IDB.set("gl", js); if (Cloud.ready) pushToCloud("gl", js, { importedAt:m.importedAt }); msNote += `Rules glossary loaded: ${Object.keys(m.weapon||{}).length} weapon abilities. `; continue; }
      if (m.format !== "listforge-missions") throw new Error("not a missions file");
      m.importedAt = Date.now(); M = m; const js = JSON.stringify(m); IDB.set("ms", js);
      msNote = `Missions loaded: ${m.primaries.length} primaries, ${m.secondaries.length} secondaries, ${m.deployments.length} deployment maps. `;
      if (Cloud.ready) pushToCloud("ms", js, { importedAt:m.importedAt });
    } catch(e) { msNote += `Couldn't read ${f.name}: it isn't a Bear Bones Forge missions or backup file. `; }
  }
  files = files.filter(f => !/\.json$/i.test(f.name));
  if (!files.length) { S.dataNote = msNote.trim(); render(); return; }
  const raw = {}; const seen = [];
  for (const f of files) {
    const key = fileKey(f.name);
    if (!FILES.map(x => x.toLowerCase()).includes(key)) continue;
    raw[key] = parseCSV(await f.text()); seen.push(key);
  }
  const missing = REQUIRED.filter(k => !raw[k]);
  if (missing.length) { S.dataNote = `Couldn't load: these files are missing: ${missing.map(m => FILES.find(f => f.toLowerCase()===m)+".csv").join(", ")}. Choose them together with the others.`; render(); return; }
  const keepF = new Set(raw.factions.map(f => f.id));
  if (!keepF.has("SM")) { S.dataNote = "Factions.csv doesn't look like the 10th edition file. Check you downloaded it from the wh40k10ed section."; render(); return; }
  const ds = raw.datasheets.filter(d => keepF.has(d.faction_id));
  const dsIds = new Set(ds.map(d => d.id));
  const byDs = k => (raw[k]||[]).filter(r => dsIds.has(r.datasheet_id));
  const dsAb = byDs("datasheets_abilities");
  const abIds = new Set(dsAb.map(a => a.ability_id).filter(Boolean));
  const out = {
    importedAt: Date.now(),
    lastUpdate: (raw.last_update && raw.last_update[0] && Object.values(raw.last_update[0])[0]) || "",
    factions: raw.factions.filter(f => keepF.has(f.id)).map(f => ({ id:f.id, name:f.name })),
    source: (raw.source||[]).map(s => ({ id:s.id, name:s.name, type:s.type })),
    datasheets: ds.map(d => { const o = {...d}; delete o.link; return o; }),
    datasheets_abilities: dsAb, datasheets_keywords: byDs("datasheets_keywords"), datasheets_models: byDs("datasheets_models"),
    datasheets_options: byDs("datasheets_options"), datasheets_wargear: byDs("datasheets_wargear"), datasheets_unit_composition: byDs("datasheets_unit_composition"),
    datasheets_models_cost: byDs("datasheets_models_cost"), datasheets_enhancements: byDs("datasheets_enhancements"),
    datasheets_leader: (raw.datasheets_leader||[]).filter(r => dsIds.has(r.leader_id)),
    stratagems: (raw.stratagems||[]).filter(s => !s.faction_id || keepF.has(s.faction_id)),
    abilities: (raw.abilities||[]).filter(a => keepF.has(a.faction_id) || abIds.has(a.id) || !a.faction_id),
    enhancements: (raw.enhancements||[]).filter(e => keepF.has(e.faction_id)),
    detachment_abilities: (raw.detachment_abilities||[]).filter(e => keepF.has(e.faction_id)),
    detachments: (raw.detachments||[]).filter(e => keepF.has(e.faction_id))
  };
  D = buildIndex(out);
  const skipped = FILES.filter(f => !seen.includes(f.toLowerCase()));
  S.dataNote = msNote + `Loaded ${seen.length} files.` + (skipped.length ? ` Not included: ${skipped.map(s=>s+".csv").join(", ")}.` : "");
  render();
  const json = JSON.stringify(out);
  IDB.set("wd", json);
  if (Cloud.ready) await pushToCloud("wd", json, { importedAt: out.importedAt, lastUpdate: out.lastUpdate });
}
async function pushToCloud(prefix, json, meta){
  try {
    setSync("Saving to your account…");
    const { enc, s } = await gzip64(json);
    const size = 200000, n = Math.ceil(s.length / size);
    for (let i = 0; i < n; i++) await Cloud.put(prefix + "-" + i, { s: s.slice(i*size, (i+1)*size) });
    await Cloud.put(prefix + "-meta", { ...meta, n, enc });
    setSync("Saved to your account");
  } catch(e) { setSync("Saved on this device only"); }
}
async function pullFromCloud(prefix, localImportedAt){
  const meta = await Cloud.get(prefix + "-meta");
  if (!meta || !meta.n || (localImportedAt && meta.importedAt <= localImportedAt)) return null;
  setSync("Fetching from your account…");
  let s = "";
  for (let i = 0; i < meta.n; i++) { const c = await Cloud.get(prefix + "-" + i); if (!c) return null; s += c.s; }
  const json = meta.enc === "gz64" ? await gunzip64(s) : s;
  IDB.set(prefix, json);
  return JSON.parse(json);
}

/* ============ backup (for use without a Claude account) ============ */
function backupData(full){ const b = { format:"listforge-backup", version:1, savedAt:Date.now(), lists:S.lists, icons:S.icons, banners:S.banners, collection:S.collection, history:S.history, game:S.game }; if (full) { if (D) b.rules = D.raw; if (M) b.missions = M; if (G) b.glossary = G; } return b; }
function importBackup(b){
  const byId = new Map(S.lists.map(l => [l.id, l])); let n = 0;
  (b.lists||[]).forEach(l => { const cur = byId.get(l.id); if (!cur || (l.updated||0) > (cur.updated||0)) { byId.set(l.id, l); n++; } });
  S.lists = [...byId.values()].sort((a,b) => (b.updated||0) - (a.updated||0)); LS.set("lists", S.lists);
  S.lists.forEach(l => saveList(l, true));
  let ic = 0; for (const k in (b.icons||{})) { S.icons[k] = b.icons[k]; ic++; if (Cloud.ready) Cloud.put(iconDoc(k), { army:k, data:b.icons[k] }).catch(()=>{}); }
  LS.set("icons", S.icons);
  if (b.collection) { Object.assign(S.collection, b.collection); saveCollection(); }
  if (b.history) { const ids = new Set(S.history.map(h => h.id)); b.history.forEach(h => { if (!ids.has(h.id)) S.history.push(h); }); S.history.sort((a,b) => b.date - a.date); saveHistory(); }
  if (b.glossary && b.glossary.format === "listforge-glossary") { G = b.glossary; IDB.set("gl", JSON.stringify(G)); }
  let bn = 0; for (const k in (b.banners||{})) { S.banners[k] = b.banners[k]; bn++; if (Cloud.ready) Cloud.put(bannerDoc(k), { army:k, data:b.banners[k] }).catch(()=>{}); }
  if (bn) IDB.set("banners", JSON.stringify(S.banners));
  if (b.game && !S.game) { S.game = fixGame(b.game); saveGame(); }
  let extra = "";
  if (b.rules && b.rules.datasheets) { D = buildIndex(b.rules); const js = JSON.stringify(b.rules); IDB.set("wd", js); if (Cloud.ready) pushToCloud("wd", js, { importedAt:b.rules.importedAt, lastUpdate:b.rules.lastUpdate }); extra += " Rules data loaded."; }
  if (b.missions && b.missions.format === "listforge-missions") { M = b.missions; const js = JSON.stringify(M); IDB.set("ms", js); if (Cloud.ready) pushToCloud("ms", js, { importedAt:M.importedAt || Date.now() }); extra += " Missions loaded."; }
  return extra.trim() + ` Backup loaded: ${n} list${n===1?"":"s"} added or updated, ${ic} icon${ic===1?"":"s"}.`;
}
function exportBackup(full){
  const json = JSON.stringify(backupData(full));
  const name = `Bear Bones Forge ${full ? "everything" : "backup"} ${new Date().toLocaleDateString("en-CA")}.json`;
  if (!window.claude) {
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type:"application/json" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("Backup saved to your downloads"); return; } catch {}
  }
  openSheet("share", "Backup", `<p class="small muted">Downloads don't work inside claude.ai. Copy this text, paste it into a new note or text file named <b>${esc(name)}</b>, and load that file on the Data tab of your other copy.</p>
    <textarea id="sharetext" readonly style="min-height:240px;font-size:.75rem;font-family:ui-monospace,Menlo,monospace">${esc(json)}</textarea><button class="btn primary" data-act="copytext">Copy to clipboard</button>`);
}

/* If a picture has a plain white background (like a JPG), make that background see-through. */
function clearWhiteBackground(c){
  const ctx = c.getContext("2d"), W = c.width, H = c.height, im = ctx.getImageData(0, 0, W, H), d = im.data;
  const white = i => d[i+3] > 0 && d[i] > 232 && d[i+1] > 232 && d[i+2] > 232;
  let op = 0, wh = 0;
  for (let x = 0; x < W; x++) for (const y of [0, H-1]) { const i = (y*W + x)*4; if (d[i+3] > 0) { op++; if (white(i)) wh++; } }
  for (let y = 0; y < H; y++) for (const x of [0, W-1]) { const i = (y*W + x)*4; if (d[i+3] > 0) { op++; if (white(i)) wh++; } }
  if (!op || wh / op < .5) return;
  const seen = new Uint8Array(W*H), stack = [];
  for (let x = 0; x < W; x++) stack.push(x, (H-1)*W + x);
  for (let y = 0; y < H; y++) stack.push(y*W, y*W + W - 1);
  while (stack.length) {
    const p = stack.pop(); if (seen[p]) continue; seen[p] = 1;
    const i = p*4; if (d[i+3] === 0 ? false : !white(i)) continue;
    d[i+3] = 0; const x = p % W, y = (p / W) | 0;
    if (x > 0) stack.push(p-1); if (x < W-1) stack.push(p+1); if (y > 0) stack.push(p-W); if (y < H-1) stack.push(p+W);
  }
  ctx.putImageData(im, 0, 0);
}

async function iconFromFile(f, a){

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const size = 160, c = document.createElement("canvas"); c.width = c.height = size;
    const sc = Math.min(size / img.width, size / img.height), w = img.width * sc, h = img.height * sc;
    c.getContext("2d").drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
    clearWhiteBackground(c);
    let data = c.toDataURL("image/png"); if (data.length > 120000) data = c.toDataURL("image/webp", .85);
    S.icons[a] = data; LS.set("icons", S.icons);
    if (Cloud.ready) Cloud.put(iconDoc(a), { army:a, data }).catch(() => toast("Icon saved on this device only"));
    return true;
  } catch { return false; } finally { URL.revokeObjectURL(url); }
}

  { k:"parchment", name:"Parchment Scroll", desc:"Aged paper, ink and oxblood", fonts:"family=EB+Garamond:wght@400;500;600;700&family=IM+Fell+English+SC", pv:{ bg:"#e6d6b0", panel:"#f2e5c4", line:"#b6995d", text:"#2b1d0e", acc:"#7b2d1a", font:'"IM Fell English SC",serif' } },
  { k:"void", name:"Void Black", desc:"True black, amber highlights, always dark", fonts:"family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700", pv:{ bg:"#000000", panel:"#0b0b0d", line:"#26262b", text:"#f4f4f5", acc:"#f5a524", font:'"IBM Plex Sans Condensed",sans-serif' } }
];
const TEXT_SIZES = { s:15, m:16, l:17.5, xl:19 };
function loadStyleFonts(st){
  if (!st.fonts || document.getElementById("font-" + st.k)) return;
  const ln = document.createElement("link"); ln.id = "font-" + st.k; ln.rel = "stylesheet";
  ln.href = "https://fonts.googleapis.com/css2?" + st.fonts + "&display=swap"; document.head.appendChild(ln);
}
function applyMode(){
  const r = document.documentElement, st = STYLES.find(x => x.k === S.settings.style) || STYLES[0];
  r.dataset.style = st.k; loadStyleFonts(st);
  const mode = st.k === "void" ? "dark" : S.mode;
  if (mode === "light" || mode === "dark") r.dataset.theme = mode; else if (!window.claude) delete r.dataset.theme;
  r.dataset.tex = S.settings.texture === false ? "off" : "on";
  r.style.fontSize = (TEXT_SIZES[S.settings.textSize] || 16) + "px";
  const m = document.querySelector('meta[name="theme-color"]'); if (m) requestAnimationFrame(() => m.content = getComputedStyle(document.body).getPropertyValue("--bg").trim() || "#111012");
}
applyMode();

/* ============ swipe left on a unit to reveal Delete ============ */
(function(){
  let st = null;
  const W = 92;
  document.addEventListener("pointerdown", e => {
    const h = e.target.closest(".unit-h"); if (!h || e.button > 0) return;
    const card = h.parentElement, open = card.classList.contains("swiped");
    st = { x:e.clientX, y:e.clientY, h, card, uid:h.dataset.u, base: open ? -W : 0, dx:0, moving:false };
  });
  document.addEventListener("pointermove", e => {
    if (!st) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.moving) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) { st.moving = true; st.card.classList.add("dragging"); } else if (Math.abs(dy) > 10) { st = null; return; } else return; }
    st.dx = dx; const pos = Math.max(-W - 24, Math.min(0, st.base + dx));
    st.h.style.transform = `translateX(${pos}px)`; st.card.style.setProperty("--reveal", Math.min(1, -pos / W));
  });
  const end = () => {
    if (!st) return; const s0 = st; st = null;
    if (!s0.moving) return;
    S.justSwiped = true; setTimeout(() => S.justSwiped = false, 400);
    s0.card.classList.remove("dragging"); s0.h.style.transform = ""; s0.card.style.removeProperty("--reveal");
    const pos = s0.base + s0.dx;
    S.swipeOpen = pos < -W / 2 ? s0.uid : (S.swipeOpen === s0.uid ? null : S.swipeOpen);
    render();
  };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();

/* ============ boot ============ */
(async function boot(){
  try { const json = await IDB.get("wd"); if (json) D = buildIndex(JSON.parse(json)); } catch {}
  try { const js = await IDB.get("ms"); if (js) M = JSON.parse(js); } catch {}
  try { const gj = await IDB.get("gl"); if (gj) G = JSON.parse(gj); } catch {}
  try { const bj = await IDB.get("banners"); if (bj) S.banners = JSON.parse(bj); } catch {}
  if (S.cur && !curList()) S.cur = null;
  render();
  await loadSiteData(false);
  const ok = await Cloud.init();
  if (!ok) { setSync("Saved on this device"); return; }
  setSync("Syncing…");
  try {
    const docs = await Cloud.all();
    const byId = new Map(S.lists.map(l => [l.id, l]));
    for (const d of docs) {
      if (d.id.startsWith("list-")) {
        const cl = d.data(); const loc = byId.get(cl.id);
        if (!loc || (cl.updated||0) > (loc.updated||0)) byId.set(cl.id, JSON.parse(JSON.stringify(cl)));
      } else if (d.id.startsWith("banner-")) {
        const bn = d.data(); if (bn && bn.army && bn.data) { S.banners[bn.army] = bn.data; IDB.set("banners", JSON.stringify(S.banners)); }
      } else if (d.id.startsWith("icon-")) {
        const ic = d.data(); if (ic && ic.army && ic.data) S.icons[ic.army] = ic.data;
      } else if (d.id === "history") {
        const h = d.data(); if (h && h.h) { const ids = new Set(S.history.map(x => x.id)); h.h.forEach(x => { if (!ids.has(x.id)) S.history.push(x); }); S.history.sort((a,b) => b.date - a.date); LS.set("history", S.history); }
      } else if (d.id === "collection") {
        const c = d.data(); if (c && c.c) { S.collection = Object.assign({}, c.c, S.collection); LS.set("collection", S.collection); }
      } else if (d.id === "game") {
        const g = d.data(); if (g && !S.game) S.game = fixGame(JSON.parse(JSON.stringify(g)));
      }
    }
    const cloudIds = new Set(docs.filter(d => d.id.startsWith("list-")).map(d => d.id.slice(5)));
    S.lists = [...byId.values()].sort((a,b) => (b.updated||0) - (a.updated||0));
    LS.set("lists", S.lists); LS.set("icons", S.icons);
    for (const l of S.lists) if (!cloudIds.has(l.id)) await Cloud.put("list-"+l.id, JSON.parse(JSON.stringify(l))).catch(()=>{});
    const wd = await pullFromCloud("wd", D?.raw?.importedAt); if (wd) D = buildIndex(wd);
    const ms = await pullFromCloud("ms", M?.importedAt); if (ms) M = ms;
    const gl = await pullFromCloud("gl", G?.importedAt); if (gl) G = gl;
    S.sync.lastLoad = Date.now();
    const pulled = wd || ms;
    setSync("Saved to your account");
    if (pulled) S.dataNote = "Data loaded from your account.";
    render();
  } catch(e) { setSync("Saved on this device"); }
})();
</script>
