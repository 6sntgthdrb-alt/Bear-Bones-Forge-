function cardVPs(c, mode){
  const vals = new Set();
  (c ? c.blocks : []).forEach(b => { if (!b.vp) return; const v = b.vp;
    const parts = v.split("·").map(x => x.trim());
    parts.forEach(x => { if (mode && /fixed|tactical/i.test(x) && !new RegExp(mode, "i").test(x)) return; (x.replace(/\(.*?\)/g, "").match(/\+?(\d+)VP/g)||[]).forEach(m => vals.add(parseInt(m.replace(/\D/g, "")))); }); });
  return [...vals].filter(x => x > 0).sort((a,b) => a - b);
}
function openScore(p, n, achieve){
  const g = S.game, c = secByName(n), mode = g.ps[p].mode;
  const vals = cardVPs(c, mode);
  openSheet("score", `Score ${n}`, `<div class="small muted">${esc(g.names[p])} · round ${g.round} secondary${achieve ? " · the card is then marked achieved" : ""}</div>
    <div class="row">${vals.map(v => `<button class="btn primary" data-act="scorevp" data-p="${p}" data-n="${esc(n)}" data-a="${achieve?1:0}" data-v="${v}">+${v} VP</button>`).join("")}</div>
    <div class="row"><input type="number" inputmode="numeric" min="0" id="scoreother" class="owninp" placeholder="VP" aria-label="Other amount"><button class="btn" data-act="scorevp" data-p="${p}" data-n="${esc(n)}" data-a="${achieve?1:0}" data-v="other">Add this amount</button></div>
    ${achieve ? `<button class="btn small" data-act="scorevp" data-p="${p}" data-n="${esc(n)}" data-a="1" data-v="0">Mark achieved without adding VP</button>` : ""}
    ${cardHtml(c, "Card", false)}`);
}
function gameAction(t){
  const g = fixGame(S.game ||= blankGame()), act = t.dataset.act;
  if (act === "gsize") { g.size = t.dataset.v; g.dep = ""; g.pri = ""; }
  else if (act === "grandom") { g.dep = pick(depList(g)).name; g.pri = pick(primList(g)).name; }
  else if (act === "gmode") { g.ps[+t.dataset.p].mode = t.dataset.v; }
  else if (act === "gsec") {
    const p = +t.dataset.p, ps = g.ps[p], n = t.dataset.n, op = t.dataset.op;
    const remove = () => { ps.active = ps.active.filter(x => x !== n); };
    if (op === "draw") {
      if (!ps.deck.length && !ps.active.length && !ps.done.length && !ps.gone.length) ps.deck = shuffle(M.secondaries.map(c => c.name));
      while (ps.active.length < 2 && ps.deck.length) ps.active.push(ps.deck.shift());
    } else if (op === "done" || op === "score") { openScore(p, n, op === "done"); return; }
    else if (op === "discard") { remove(); ps.gone.push(n); }
    else if (op === "neworders") {
      if (g.cp[p] < 1) { toast("Not enough CP for New Orders."); return; }
      g.cp[p]--; remove(); ps.gone.push(n); if (ps.deck.length) ps.active.push(ps.deck.shift());
    } else if (op === "reset") { g.ps[p] = { ...blankPlayerSec(), mode: ps.mode, fixed: ps.fixed }; }
  }
  saveGame(); render();
}

/* ============ import ============ */
async function importFiles(files){
  S.dataNote = "Reading files…"; render();
  const jsons = files.filter(f => /\.json(\.gz)?$/i.test(f.name));
  let msNote = "";
  for (const f of jsons) {
    try {
      const m = await readJsonFile(f);
      if (m.format === "listforge-backup") { msNote += importBackup(m) + " "; continue; }
      if (m.format === "listforge-glossary") { m.importedAt = Date.now(); G = m; const js = JSON.stringify(m); IDB.set("gl", js); if (Cloud.ready) pushToCloud("gl", js, { importedAt:m.importedAt }); msNote += `Rules glossary loaded: ${Object.keys(m.weapon||{}).length} weapon abilities and ${Object.keys(m.terms||{}).length} core rules. `; continue; }
      if (m.format !== "listforge-missions") throw new Error("not a missions file");
      m.importedAt = Date.now(); M = m; const js = JSON.stringify(m); IDB.set("ms", js);
      msNote = `Missions loaded: ${m.primaries.length} primaries, ${m.secondaries.length} secondaries, ${m.deployments.length} deployment maps. `;
      if (Cloud.ready) pushToCloud("ms", js, { importedAt:m.importedAt });
    } catch(e) { msNote += `Couldn't read ${f.name}: it isn't a Bear Bones Forge missions or backup file. `; }
  }
  files = files.filter(f => !/\.json(\.gz)?$/i.test(f.name));
  if (!files.length) { S.dataNote = msNote.trim(); render(); return; }
  const raw = {}; const seen = [];
  for (const f of files) {
    const key = fileKey(f.name);
    if (!FILES.map(x => x.toLowerCase()).includes(key)) continue;
    raw[key] = parseCSV(await f.text()); seen.push(key);
  }
  const missing = REQUIRED.filter(k => !raw[k]);
  if (missing.length) { S.dataNote = `Couldn't load: these files are missing: ${missing.map(m => FILES.find(f => f.toLowerCase()===m)+".csv").join(", ")}. Choose them together with the others.`; render(); return; }
  const keepF = new Set(raw.factions.map(f => f.id));
  if (!keepF.has("SM")) { S.dataNote = "Factions.csv doesn't look like the 10th edition file. Check you downloaded it from the wh40k10ed section."; render(); return; }
  const ds = raw.datasheets.filter(d => keepF.has(d.faction_id));
  const dsIds = new Set(ds.map(d => d.id));

    datasheets_models_cost: byDs("datasheets_models_cost"), datasheets_enhancements: byDs("datasheets_enhancements"),
    datasheets_leader: (raw.datasheets_leader||[]).filter(r => dsIds.has(r.leader_id)),

async function pushToCloud(prefix, json, meta){
  try {
    setSync("Saving to your account…");
    const { enc, s } = await gzip64(json);
    const size = 200000, n = Math.ceil(s.length / size);
    for (let i = 0; i < n; i++) await Cloud.put(prefix + "-" + i, { s: s.slice(i*size, (i+1)*size) });
    await Cloud.put(prefix + "-meta", { ...meta, n, enc });
    setSync("Saved to your account");
  } catch(e) { setSync("Saved on this device only"); }
}
async function pullFromCloud(prefix, localImportedAt){
  const meta = await Cloud.get(prefix + "-meta");
  if (!meta || !meta.n || (localImportedAt && meta.importedAt <= localImportedAt)) return null;
  setSync("Fetching from your account…");
  let s = "";
  for (let i = 0; i < meta.n; i++) { const c = await Cloud.get(prefix + "-" + i); if (!c) return null; s += c.s; }
  const json = meta.enc === "gz64" ? await gunzip64(s) : s;
  IDB.set(prefix, json);
  return JSON.parse(json);
}

function backupData(full){ const b = { format:"listforge-backup", version:1, savedAt:Date.now(), lists:S.lists, icons:S.icons, banners:S.banners, collection:S.collection, history:S.history, game:S.game }; if (full) { if (D) b.rules = D.raw; if (M) b.missions = M; if (G) b.glossary = G; } return b; }

  S.lists = [...byId.values()].sort((a,b) => (b.updated||0) - (a.updated||0)); LS.set("lists", S.lists);

  let bn = 0; for (const k in (b.banners||{})) { S.banners[k] = b.banners[k]; bn++; if (Cloud.ready) Cloud.put(bannerDoc(k), { army:k, data:b.banners[k] }).catch(()=>{}); }
  if (bn) IDB.set("banners", JSON.stringify(S.banners));
  if (b.game && !S.game) { S.game = fixGame(b.game); saveGame(); }
  let extra = "";

}

function clearWhiteBackground(c){

  }
  ctx.putImageData(im, 0, 0);
}

  if (window.claude || !/^https?:$/.test(location.protocol)) return false;
  try {
    let url = null, tag = "";
    for (const u of ["data/everything.json.gz", "everything.json.gz", "data/everything.json", "everything.json", "data/Everything.json", "Everything.json"]) {
      const h = await fetch(u, { method:"HEAD", cache:"no-store" }).catch(() => null);
      if (h && h.ok) { url = u; tag = u + "|" + (h.headers.get("etag") || h.headers.get("last-modified") || h.headers.get("content-length") || ""); break; }
    }
    if (!url) { if (force) toast("No data file found on the site."); return false; }
    if (!force && D && G && LS.get("siteTag", "") === tag) return false;
    const r = await fetch(url, { cache:"no-store" }); if (!r.ok) return false;
    const b = /\.gz$/.test(url) ? JSON.parse(await gunzipText(await r.arrayBuffer())) : await r.json();
    if (b.format !== "listforge-backup") return false;
    const note = importBackup(b); LS.set("siteDataAt", b.savedAt || Date.now()); LS.set("siteTag", tag);
    S.dataNote = "Loaded from the site: " + note; render(); return true;
  } catch { if (force) toast("Couldn't load the site's data file."); return false; }
}

/* ============ swipe left on a unit to reveal Delete ============ */
(function(){

    const h = e.target.closest(".unit-h"); if (!h || e.button > 0) return;
    if (e.pointerType === "touch" && S.settings.swipeTabs !== false && (e.clientX < 28 || e.clientX > innerWidth - 28)) return;

    st = { x:e.clientX, y:e.clientY, h, card, uid:h.dataset.u, base: open ? -W : 0, dx:0, moving:false };
  });
  document.addEventListener("pointermove", e => {
    if (!st) return;

    if (!st.moving) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) { st.moving = true; st.card.classList.add("dragging"); } else if (Math.abs(dy) > 10) { st = null; return; } else return; }

})();

    const e = u.enh && D.enhById[u.enh]; if (e) { const ds = plain(e.description || "").match(/\d+(?=")/g); if (ds) dist.push(`<span class="rng"><b>${[...new Set(ds)].map(d => d + '"').join(", ")}</b> ${esc(e.name)}</span>`); }
    const leading = u.lead && byId[u.lead];
    const lead = leading ? ` <span class="muted small">→ leading ${label(leading)}</span>` : "";
    const ch = leading ? null : chargeHtml(l, u), led = l.units.filter(x => x.lead === u.uid && D.ds[x.ds]);
    const tag = leading ? `moves with ${label(leading)}` : `M ${ch.M ? ch.M + '"' : "–"}${ch.M ? ` · charge ${ch.likely}"+ · reach ≈${ch.M + ch.likely}"` : ""}`;
    return `<details class="srow brow"><summary><span class="sname">${label(u)}${lead}${led.length ? ` <span class="muted small">with ${led.map(label).join(", ")}</span>` : ""}</span><span></span><span class="tags"><span class="abwho">${tag}</span></span></summary>
      <div class="bgrid">${rng.length ? `<div><div class="bh">Guns</div>${rng.join("")}</div>` : ""}${dist.length ? `<div><div class="bh">Ability ranges</div>${dist.join("")}</div>` : ""}${ch ? ch.html : `<div class="small muted">Charges with ${label(leading)}; see that unit for its charge odds.</div>`}</div></details>`;
  }).join("");
  const measure = fold("measure", "Pre-measure", `Longest gun ${longest}" · tap a unit`, `<div class="small muted">Move, guns, distances in a unit's abilities and charge odds. Attached characters, enhancements and the unit's own rules are counted.</div>${rows}`);
  // 2. before the game
  const pre = [];
  const hasAb = (u, rx) => abOf(u).find(a => rx.test(a.name));
  units.forEach(u => {
    const ds = hasAb(u, /^deep strike$/i), sc = hasAb(u, /^scouts/i), inf = hasAb(u, /^infiltrators$/i), lo = hasAb(u, /^lone operative$/i), st = hasAb(u, /^stealth$/i), ff = hasAb(u, /^fights first$/i);
    const tags = [ds && "Deep Strike: arrives 9\" from enemies", sc && `Scouts ${esc((sc.param || sc.name.replace(/\D+/g, "")) || "")}"`.replace(/ "$/, ""), inf && "Infiltrators: deploy 9\" from enemies", lo && "Lone Operative", st && "Stealth (−1 to be hit at range)", ff && "Fights First"].filter(Boolean);
    if (u.lead && byId[u.lead]) tags.push(`Attach to ${label(byId[u.lead])} when declaring battle formations`);
    const e = u.enh && D.enhById[u.enh]; if (e) tags.push(`Enhancement: ${esc(e.name)}`);
    if (u.warlord) tags.push("Warlord");
    if (tags.length) pre.push(`<div class="brow2"><b>${label(u)}</b><div class="small">${tags.map(t => `<span class="pill">${t}</span>`).join(" ")}</div></div>`);
  });
  const before = fold("pre", "Before the game", `${pre.length} unit${pre.length === 1 ? "" : "s"} with deployment notes`, pre.join("") || `<div class="small muted">Nothing special to set up. Everything deploys normally.</div>`);
  // 3. phase reminders
  const ph = PHASES.map(p => { const ab = abilitiesNow(l, p); return `<details class="dsub"><summary>${p} · ${ab.length}</summary>${ab.length ? ab.map(a => `<details class="srow"><summary><span class="sname">${esc(a.name)}</span><span></span><span class="tags"><span class="abwho">${esc(a.who)}</span></span></summary><div class="rich">${sanitize(a.html)}</div></details>`).join("") : `<div class="small muted">Nothing extra this phase.</div>`}</details>`; }).join("");
  const phases = fold("phase", "Phase reminders", "What your army does in each phase", ph);
  // 4. once per battle / limited uses
  const used = (S.used ||= LS.get("used", {}))[l.id || "opp"] || {}, once = [], seenO = new Set();
  const addOnce = (name, who, text) => { const m = text.match(/once per (battle round|battle|turn|phase)/i); if (!m) return; const k = (name + "|" + who).replace(/\W+/g, "_"); if (seenO.has(k)) return; seenO.add(k);
    once.push(`<label class="check bonce${used[k] ? " used" : ""}"><input type="checkbox" data-ch="bused" data-k="${k}"${used[k] ? " checked" : ""}><span><b>${esc(name)}</b> <span class="muted small">· ${esc(who)} · once per ${esc(m[1].toLowerCase())}</span></span></label>`); };
  units.forEach(u => { abOf(u).forEach(a => { if (!/faction/i.test(a.type)) addOnce(a.name, D.ds[u.ds].name, a.text); }); const e = u.enh && D.enhById[u.enh]; if (e) addOnce(e.name, unitLabel(l, u), plain(e.description || "")); });
  if (l.det) detRules(l.army, l.det).forEach(r => addOnce(r.name, "Detachment", plain(r.description || "")));
  const onceBox = fold("once", "Limited uses", `${once.length} to track · tick when used`, once.length ? once.join("") + `<button class="btn small" data-act="busedreset">Reset for a new game</button>` : `<div class="small muted">No once-per-battle abilities in this list.</div>`);
  // 5. weapon rules worth remembering
  const KW = [["hazardous","Hazardous","roll a D6 per weapon after attacking; on a 1 a model is destroyed (or takes 3 mortal wounds)"],["precision","Precision","can pick out an attached Character"],["indirect fire","Indirect Fire","can shoot without line of sight (−1 to hit, target gets cover)"],["one shot","One Shot","fires once per battle"],["pistol","Pistol","can shoot while in Engagement Range"],["assault","Assault","can shoot after Advancing"],["lance","Lance","+1 to wound on the charge"],["melta","Melta","extra damage at half range"],["blast","Blast","+1 attack per 5 models in the target; not into Engagement Range"],["extra attacks","Extra Attacks","used on top of another melee weapon"],["psychic","Psychic","psychic attack"],["lethal hits","Lethal Hits","6s to hit auto-wound"],["sustained hits","Sustained Hits","6s to hit score extra hits"],["devastating wounds","Devastating Wounds","6s to wound skip saves"],["anti-","Anti-","critical wounds on a lower roll against a keyword"]];
  const kwRows = KW.map(([rx, name, tip]) => { const who = [...new Set(units.filter(u => groupWeapons({ members:[u] }).some(x => lc(plain(x.w.description || "")).includes(rx))).map(u => unitLabel(l, u)))];
    return who.length ? `<div class="brow2"><b>${name}</b> <span class="muted small">${tip}</span><div class="small">${who.map(esc).join(" · ")}</div></div>` : ""; }).join("");
  const weaponsBox = fold("wkw", "Weapon rules to remember", "Which units carry which special rules", kwRows || `<div class="small muted">No special weapon rules in this list.</div>`);
  const reach = fold("reach", "Distance checker", "Measure a gap, see who can reach it", `<label class="f rdist">Gap to the enemy or objective (inches)<div class="row" style="gap:8px;align-items:center"><button class="btn small" data-act="bdist" data-d="-1" aria-label="1 inch less">−</button><input type="number" inputmode="decimal" min="0" max="72" step="0.5" id="bdist" data-in="bdist" value="${esc(S.bdist ?? 12)}" style="text-align:center;font-weight:700"><button class="btn small" data-act="bdist" data-d="1" aria-label="1 inch more">+</button></div></label>
    <div class="small muted">Odds for your next turn. <b>Reach</b>: get to that spot (an objective, a ruin) by moving or Advancing. <b>Shoot</b>: move then fire. <b>Charge</b>: move then charge, finishing within 1" of the enemy. Attached characters and unit rules are counted.</div><div id="bdistres">${reachHtml(l, S.bdist ?? 12)}</div>`);
  const plan = fold("plan", "Game plan", "Unit roles, gaps and deployment order", `<div class="small muted">A first read of what each unit is for. These are rules of thumb, not orders.</div>${gamePlanHtml(l)}`);
  const tipsBox = fold("tips", "Rules of thumb", "Short tips for each phase", tipsHtml(["Before", ...PHASES]));
  const whose = S.briefOpp && S.game && l === S.game.opp;
  return `<div class="small muted brief-intro">A study of ${whose ? "your opponent's list " : ""}<b>${esc(l.name)}</b>${whose ? ". Use it to pre-measure their threats: where they can reach, and how likely." : " with the wargear you picked."}</div><div class="briefgrid">${[plan, reach, measure, before, onceBox, phases, weaponsBox, tipsBox].join("")}</div>`;
}
function abilitiesNow(l, phase){
  const rx = PHASE_RX[phase], out = [], seen = new Set();
  const add = (name, who, html) => { const t = plain(html); if (!name || !t || !rx.test(t)) return; const k = name + "|" + who; if (seen.has(k)) return; seen.add(k); out.push({ name, who, html }); };
  armyRules(l.army).forEach(a => add(a.name, "Army rule", a.description));
  if (l.det) detRules(l.army, l.det).forEach(a => add(a.name, "Detachment rule", a.description));
  const done = new Set();
  l.units.forEach(u => {
    if (!D.ds[u.ds]) return;
    const e = u.enh && D.enhById[u.enh]; if (e) add(e.name, unitLabel(l, u) + " (enhancement)", e.description);
    if (done.has(u.ds)) return; done.add(u.ds);
    (D.abil[u.ds]||[]).forEach(a => { const g = a.ability_id && D.abilities[a.ability_id]; if (/faction/i.test(a.type||"")) return;
      add(a.name || (g && g.name) || "", D.ds[u.ds].name, a.description || (g && g.description) || ""); });
  });
  return out;
}

/* ============ bookmarks ============ */
const isMarked = k => S.marks.some(m => m.k === k);
const starBtn = (k, name) => `<button class="star${isMarked(k) ? " on" : ""}" data-act="mark" data-k="${esc(k)}" data-n="${esc(name)}" aria-label="${isMarked(k) ? "Remove bookmark" : "Bookmark"}: ${esc(name)}" aria-pressed="${isMarked(k)}">${isMarked(k) ? "★" : "☆"}</button>`;
function markHtml(m){
  const [kind, ...rest] = m.k.split(":"), key = rest.join(":");
  if (kind === "strat") { const st = D && D.strat.find(x => x.id === key); return st ? stratRow(st) : ""; }
  if (kind === "term") { const t = G && G.terms && G.terms[key]; return t ? `<details class="srow"><summary><span class="sname">${esc(t.name)}</span>${starBtn(m.k, t.name)}<span class="tags"><span class="tag">Core Rules</span></span></summary><div class="rich ruletext">${termRich(t.text, "t:" + key)}</div></details>` : ""; }
  if (kind === "rule") { const r = ruleFor(key); return r ? `<details class="srow"><summary><span class="sname">${esc(r.name)}</span>${starBtn(m.k, r.name)}<span class="tags"><span class="tag">${esc(r.kind)}</span></span></summary><div class="rich ruletext">${termRich(r.text)}</div></details>` : ""; }
  return "";
}
function marksHtml(){
  if (!S.marks.length) return `<div class="empty"><p>No bookmarks yet. Tap the ☆ next to any stratagem, or at the top of a rule, to save it here.</p></div>`;
  return S.marks.map(markHtml).join("");
}

document.addEventListener("toggle", e => { const k = e.target && e.target.dataset && e.target.dataset.keep; if (k) S.keep[k] = e.target.open; }, true);
window.addEventListener("hashchange", () => { if (/^#list=/.test(location.hash)) openSharedFromHash(); });
(async function boot(){
  try { const json = await IDB.get("wd"); if (json) D = buildIndex(JSON.parse(json)); } catch {}
  try { const js = await IDB.get("ms"); if (js) M = JSON.parse(js); } catch {}
  try { const gj = await IDB.get("gl"); if (gj) G = JSON.parse(gj); } catch {}
  try { const bj = await IDB.get("banners"); if (bj) S.banners = JSON.parse(bj); } catch {}
  if (S.cur && !curList()) S.cur = null;
  render();
  if (/^#list=/.test(location.hash)) openSharedFromHash();
  await loadSiteData(false);
  if (/^#list=/.test(location.hash)) openSharedFromHash();
  const ok = await Cloud.init();
  if (!ok) { setSync("Saved on this device"); return; }
  setSync("Syncing…");
  try {
    const docs = await Cloud.all();
    const byId = new Map(S.lists.map(l => [l.id, l]));
    for (const d of docs) {
      if (d.id.startsWith("list-")) {
        const cl = d.data(); const loc = byId.get(cl.id);
        if (!loc || (cl.updated||0) > (loc.updated||0)) byId.set(cl.id, JSON.parse(JSON.stringify(cl)));
      } else if (d.id.startsWith("banner-")) {
        const bn = d.data(); if (bn && bn.army && bn.data) { S.banners[bn.army] = bn.data; IDB.set("banners", JSON.stringify(S.banners)); }
      } else if (d.id.startsWith("icon-")) {
        const ic = d.data(); if (ic && ic.army && ic.data) S.icons[ic.army] = ic.data;
      } else if (d.id === "history") {
        const h = d.data(); if (h && h.h) { const ids = new Set(S.history.map(x => x.id)); h.h.forEach(x => { if (!ids.has(x.id)) S.history.push(x); }); S.history.sort((a,b) => b.date - a.date); LS.set("history", S.history); }
      } else if (d.id === "collection") {
        const c = d.data(); if (c && c.c) { S.collection = Object.assign({}, c.c, S.collection); LS.set("collection", S.collection); }
      } else if (d.id === "game") {
        const g = d.data(); if (g && !S.game) S.game = fixGame(JSON.parse(JSON.stringify(g)));
      }
    }
    const cloudIds = new Set(docs.filter(d => d.id.startsWith("list-")).map(d => d.id.slice(5)));
    S.lists = [...byId.values()].sort((a,b) => (b.updated||0) - (a.updated||0));
    LS.set("lists", S.lists); LS.set("icons", S.icons);
    for (const l of S.lists) if (!cloudIds.has(l.id)) await Cloud.put("list-"+l.id, JSON.parse(JSON.stringify(l))).catch(()=>{});
    const wd = await pullFromCloud("wd", D?.raw?.importedAt); if (wd) D = buildIndex(wd);
    const ms = await pullFromCloud("ms", M?.importedAt); if (ms) M = ms;
    const gl = await pullFromCloud("gl", G?.importedAt); if (gl) G = gl;
    S.sync.lastLoad = Date.now();
    const pulled = wd || ms;
    setSync("Saved to your account");
    if (pulled) S.dataNote = "Data loaded from your account.";
    render();
  } catch(e) { setSync("Saved on this device"); }
})();
