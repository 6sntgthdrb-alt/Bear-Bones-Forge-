<style>
/* Layout idea: a one-screen phone app (sticky header with the points bar, scrolling middle, tab bar at the bottom), dressed as a gothic codex: carved serif headings, gold trim, parchment by day and dark stone by night. Inside a list the army takes over colours, banner, texture and lettering. */
:root{
  --bg-b:#ece3cf;
  --panel-b:#f6efdf;
  --panel2-b:#e6dbc2;
  --line-b:#c9b993;
  --text:#2a2219;
  --muted-b:#6f6250;
  --bg:var(--bg-b); --panel:var(--panel-b); --panel2:var(--panel2-b); --line:var(--line-b); --muted:var(--muted-b);
  --r:10px; --r-sm:8px;
  --accent:#8a6a2b;
  --trim:#9c7a32;
  --on-accent:#fff;
  --ok:#2f7a4c;
  --warn:#9a6a0f;
  --err:#a8322b;
  --shade:rgba(60,40,10,.10);
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --army-title:var(--display);
  --army-head:var(--display);
  --tex-opacity:.10;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-b:#121013; --panel-b:#1b181b; --panel2-b:#242024; --line-b:#3a3226; --text:#ece4d4; --muted-b:#a39882;
    --accent:#b8964a; --trim:#c9a75a; --ok:#6cc48e; --warn:#e3b04f; --err:#e56a5f; --shade:rgba(0,0,0,.35); --tex-opacity:.16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-b:#121013; --panel-b:#1b181b; --panel2-b:#242024; --line-b:#3a3226; --text:#ece4d4; --muted-b:#a39882;
  --accent:#b8964a; --trim:#c9a75a; --ok:#6cc48e; --warn:#e3b04f; --err:#e56a5f; --shade:rgba(0,0,0,.35); --tex-opacity:.16;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{margin:0}
body{margin:0;min-height:100vh;min-height:100dvh}
body{background:var(--bg);color:var(--text);font:1rem/1.45 var(--body);-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),var(--bg));border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font:700 15px var(--display);color:var(--on-accent)}
.brand h1{font-size:1.25rem;flex:1}
.sync{font-size:.75rem;color:var(--muted)}
.pbar{margin-top:8px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.pbar > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pbar.over > i{background:var(--err)}
.pline{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:4px}

main{flex:1;padding:14px 16px calc(90px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:10px 0 8px;font:600 .8rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--err)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45}
.iconbtn{background:none;border:0;padding:6px;color:var(--muted);cursor:pointer;border-radius:6px}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--display);font-weight:600}
label.f > *{text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:400;font-size:1rem;color:var(--text)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.pill.acc{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}

.issues{display:flex;flex-direction:column;gap:6px}
.issue{display:flex;gap:8px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--warn)}
.issue.err{border-left-color:var(--err)}

.sect{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 55%,var(--bg))}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sect-h h3{font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.addbtn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}
.addbtn .muted{margin-left:auto;font-weight:400}
.adddrop{border:1px solid var(--line);border-radius:10px;padding:4px 12px 8px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.adddrop input{margin-top:8px}
.group-h{font:700 .8rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px;display:flex;justify-content:space-between}
.unit{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px}
.unit.has-err{border-left-color:var(--err)}
.unit.warlord{border-left-color:var(--accent)}
.unit-h{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.unit-h .nm{font-weight:600}
.unit-h .pts{font:700 1.05rem var(--display)}
.unit-b{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}

.listitem{display:flex;gap:12px;align-items:center;cursor:pointer}
.listitem .swatch{width:8px;align-self:stretch;border-radius:4px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:92%;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1}
.sheet-c > *{flex-shrink:0}
.sheet-c{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}

.ds-stats{width:100%;border-collapse:collapse;text-align:center}
.ds-stats th{font:600 .75rem var(--display);letter-spacing:.08em;color:var(--muted);padding:4px 2px}
.ds-stats td{font:700 1.15rem var(--display);padding:6px 2px;background:var(--panel2);border:2px solid var(--bg)}
.ds-stats td.mn{font:500 .85rem var(--body);text-align:left;padding-left:8px}
.tblwrap{overflow-x:auto}
.wg{width:100%;border-collapse:collapse;font-size:.84rem}
.wg th{font:600 .72rem var(--display);letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.wg th:first-child{text-align:left}
.wg td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.wg td:first-child{text-align:left}
.wg .kws{display:block;font-size:.78rem;color:var(--accent);font-weight:600}
.sec-h{font:700 .82rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.rich{font-size:.92rem}
.rich p{margin:.3em 0}
.rich ul{margin:.3em 0;padding-left:1.2em}
.rich table{border-collapse:collapse;font-size:.85rem}
.rich td,.rich th{border:1px solid var(--line);padding:3px 5px}
.ab{padding:8px 0;border-bottom:1px solid var(--line)}
.ab:last-child{border-bottom:0}
.ab b.n{font-family:var(--display);font-size:1.02rem;letter-spacing:.02em}
.strat{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.strat .cp{font:700 1.1rem var(--display);color:var(--accent);min-width:40px;text-align:right}

.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 10px;font:600 .9rem var(--display);letter-spacing:.04em;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.picker-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.picker-row .nm{flex:1;min-width:0;cursor:pointer}
.picker-row .nm small{display:block;color:var(--muted)}

.tracker{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.tracker .hd{font:700 .8rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.tracker input{text-align:center;padding:7px 4px}
.big{font:700 2.2rem var(--display);text-align:center;line-height:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:1.3rem;line-height:1}

.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:6px}
.mcard{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:0 12px}
.mcard summary{cursor:pointer;padding:10px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mcard[open]{padding-bottom:10px}
.mcard .kind{font:700 .7rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.cb-fl{font-style:italic;color:var(--muted);font-size:.88rem;margin-bottom:6px}
.cb-h{font:700 .78rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:10px}
.cb-when{font-size:.9rem;margin:3px 0}
.cb-p{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;font-size:.92rem;margin:4px 0}
.cb-li{padding-left:10px}
.cb-or{text-align:center;font:700 .75rem var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:4px 0}
.vp{flex:none;font:700 .85rem var(--display);background:var(--accent);color:var(--on-accent);border-radius:6px;padding:2px 7px;text-align:center;max-width:46%}
.map{margin:0}.map img{width:100%;border-radius:8px;display:block}.map figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
.actcard{display:flex;flex-direction:column;gap:6px}
details.card > summary{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;z-index:30;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.filelinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;font-size:.88rem}
.credit{font-size:.78rem;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Gothic codex layer ===== */
body{position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--tex-opacity);background:var(--tex,none)}
h1,h2,h3{font-weight:600}
.brand h1{font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase}
.brand .mark{border-radius:3px;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--trim);font-family:var(--display)}
header.top{border-bottom:1px solid var(--trim);box-shadow:0 1px 0 var(--shade)}
.card,.unit,.sect,.strat,.mcard{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trim) 18%,transparent),0 1px 2px var(--shade)}
.card,.sect{border-color:var(--line)}
.sect-h h3{font-family:var(--army-head);display:flex;align-items:center;gap:10px}
.sect-h h3::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--trim);flex:none}
.sec-h,.cb-h,.group-h{font-family:var(--display);letter-spacing:.1em}
.sec-h{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--trim) 45%,transparent)}
.btn.primary{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trim) 60%,transparent)}
.addbtn{border-color:color-mix(in srgb,var(--trim) 55%,var(--line));font-family:var(--body)}
nav.tabs{border-top:1px solid var(--trim)}
nav.tabs button{font-family:var(--display);letter-spacing:.08em;font-size:.72rem}
.unit-h .pts,.big{font-family:var(--display)}
.pill.acc{box-shadow:inset 0 0 0 1px var(--trim)}
.listitem h3{font-family:var(--army-head)}
/* Army banner */
.banner{position:relative;overflow:hidden;border-radius:12px;padding:16px 14px;display:flex;gap:14px;align-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));box-shadow:inset 0 0 0 1px var(--trim),inset 0 0 0 4px color-mix(in srgb,#000 25%,transparent),0 2px 8px var(--shade)}
.banner::after{content:"";position:absolute;inset:0;background:var(--banner-pat,none);opacity:.22;pointer-events:none}
.banner svg{width:64px;height:64px;flex:none;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.banner .bt{position:relative;z-index:1;min-width:0}
.banner .b-alleg{font:600 .7rem var(--display);letter-spacing:.18em;text-transform:uppercase;opacity:.85;color:var(--trim)}
.banner .b-title{font-family:var(--army-title);font-size:2rem;line-height:1.05;margin:2px 0;text-shadow:0 2px 3px rgba(0,0,0,.45);overflow-wrap:anywhere}
.banner .b-sub{font-size:.9rem;opacity:.9}
body[data-alleg="xenos"] .banner .b-title{text-transform:uppercase;letter-spacing:.06em;font-size:1.6rem}
body[data-alleg="chaos"] .banner .b-title{letter-spacing:.03em}
.lemb{width:46px;height:46px;flex:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));display:grid;place-items:center}
.lemb svg{width:38px;height:38px}
.cicon{width:100%;height:100%;object-fit:contain;display:block}
.banner .cicon{width:64px;height:64px;flex:none;position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.lemb .cicon{width:38px;height:38px}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
.iconcell{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.iconcell .lemb{width:40px;height:40px}.iconcell .lemb svg,.iconcell .lemb .cicon{width:32px;height:32px}
.wgbox{display:flex;flex-direction:column;gap:8px}
.wgpill{font-weight:500;color:var(--muted)}
.wgf{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:8px}
.fcard{position:relative;height:96px;border-radius:8px;border:1px solid color-mix(in srgb,var(--accent) 60%,#000);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:10px;text-align:left;cursor:pointer;overflow:hidden;box-shadow:inset 0 -50px 40px -10px rgba(0,0,0,.6)}
.fcard:hover,.fcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fcard .fname{font:700 1rem var(--display);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8);letter-spacing:.02em}
.fcard .fcount{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000}
.banner{--accent:var(--army-acc,var(--style-acc));background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 85%,transparent),color-mix(in srgb,var(--accent) 25%,transparent)),var(--scene,none) center/cover,var(--accent) !important}
.hint{color:var(--accent)}
.attach-h{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding-top:8px;border-top:2px solid var(--trim);margin-top:4px}
.mcard.attached{border-color:var(--trim)}
.phases{display:flex;gap:4px}
.phases button{flex:1 1 auto;padding-left:4px !important;padding-right:4px !important}
.phases button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 1px;font:700 .68rem var(--body);letter-spacing:.01em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.phases button[aria-pressed="true"]{background:var(--accent);border-color:var(--trim);color:var(--on-accent)}
.cpb{font:700 .8rem var(--display);background:var(--accent);color:var(--on-accent);border-radius:5px;padding:1px 6px}
.battle{border-color:var(--trim)}
.delbtn{align-self:flex-start;color:var(--muted)}
.delbtn:hover,.delbtn:focus-visible{color:var(--err)}
.delask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--err) 12%,var(--panel2));border:1px solid color-mix(in srgb,var(--err) 45%,transparent);font-size:.9rem}
.delask span{flex:1;min-width:140px}
.btn.danger-solid{background:var(--err);border-color:var(--err);color:#fff}
.banner.custom{background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.15) 70%,rgba(0,0,0,0)),var(--scene) center/cover,var(--accent) !important}
.banner.custom::after{display:none}
.detgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.detbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--trim) 15%,transparent)}
.detbox.sel{border-color:var(--trim);box-shadow:0 0 0 1px var(--trim)}
.detbox h3{font-size:1.05rem}
.dr-name{font-weight:700;margin-bottom:2px}
.dsub > summary{cursor:pointer;font:600 .78rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-top:1px solid var(--line)}
.srow{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:4px 0}
.srow.t-you{border-left-color:#4a7fd4}.srow.t-either{border-left-color:#3aa86a}.srow.t-opp{border-left-color:#d4493f}
.srow > summary{cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;list-style:none}
.srow > summary::-webkit-details-marker{display:none}
.sname{font-weight:700;color:var(--accent)}
.cpbox{font:700 .8rem var(--display);border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:1px 7px;white-space:nowrap}
.tags{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px}
.tag{font:600 .7rem var(--body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tag.t-you{border-color:#4a7fd4;color:#6f9be6}.tag.t-either{border-color:#3aa86a;color:#5cc58a}.tag.t-opp{border-color:#d4493f;color:#e5706a}
.srow .rich{padding-top:6px}
/* ===== Army theme through the whole app ===== */
body.themed{--acc-text:var(--acc-text-l);
  --bg:color-mix(in srgb,var(--accent) 8%,var(--bg-b)); --panel:color-mix(in srgb,var(--accent) 7%,var(--panel-b)); --panel2:color-mix(in srgb,var(--accent) 12%,var(--panel2-b)); --line:color-mix(in srgb,var(--accent) 27%,var(--line-b)); --muted:color-mix(in srgb,var(--accent) 20%,var(--muted-b))}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) body.themed{--acc-text:var(--acc-text-d)} }
:root[data-theme="dark"] body.themed{--acc-text:var(--acc-text-d)}
body.themed main b, body.themed main strong, body.themed .sheet b, body.themed .sheet strong{color:var(--acc-text)}
body.themed .unit-h .nm, body.themed .listitem h3, body.themed .sname, body.themed .mcard summary b, body.themed .dr-name, body.themed .ab b.n, body.themed .card h3, body.themed .detbox h3{color:var(--acc-text)}
body.themed .sec-h, body.themed .sect-h h3, body.themed .hint{color:var(--acc-text)}
body.themed .wg .kws{color:var(--acc-text)}
body.themed header.top{background:var(--bg)}
body.themed nav.tabs{background:var(--panel)}
body.themed nav.tabs button[aria-current="page"]{color:var(--acc-text)}
body.themed .banner b, body.themed .fcard b, body.themed .pill.acc, body.themed .btn.primary{color:var(--on-accent)}
.sizerow{display:flex;gap:6px;align-items:flex-end}
.ownrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.owninp{width:76px !important;text-align:center}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent)}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand{flex-wrap:wrap;row-gap:0}
.brand h1{font-size:1.1rem}
.sync{flex-basis:100%;padding-left:38px;line-height:1.2;margin-top:-2px}
.detcur .detbox{border-color:var(--trim)}
.detempty{padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.seg button{white-space:nowrap}
.segsub{display:block;font:500 .72rem var(--body);opacity:.8;letter-spacing:0}
@media (max-width:350px){.phases button{font-size:.6rem}}
.umodels{font-size:.85rem;color:var(--muted);margin-top:1px}
.unit{position:relative;overflow:hidden}
.unit-h{position:relative;z-index:1;background:var(--panel);transition:transform .2s ease;touch-action:pan-y;border-radius:10px}

.unit.swiped .swipedel{opacity:1}
.unit-b{position:relative;z-index:1;background:var(--panel)}
.toastbtn{margin-left:12px;background:none;border:0;color:var(--acc-text,var(--accent));font-weight:700;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){.unit-h{transition:none}}
.pill.legend{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);font-size:.68rem;padding:1px 6px;vertical-align:middle}
.cntrow{display:flex;align-items:center;gap:8px;margin:-2px 0 4px}
.kwbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
.kwpill{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.hrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

.stylecard .sp{height:86px;padding:8px;display:flex;flex-direction:column;gap:5px}
.stylecard .sp-h{font-size:.95rem;font-weight:700;line-height:1.1}
.stylecard .sp-c{flex:1;border:1px solid;padding:4px 6px;display:flex;align-items:center;gap:6px;font-size:.7rem}
.stylecard .sp-b{width:22px;height:8px;border-radius:2px}
.stylecard .sl{padding:0 10px 9px;font-size:.82rem}
.stylecard .sl b{display:block;font-size:.92rem}
/* Clickable rule terms */
.term{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:700;color:var(--acc-text,var(--accent));text-decoration:underline dotted color-mix(in srgb,currentColor 55%,transparent);text-underline-offset:3px;cursor:pointer;display:inline;text-align:inherit}
.term:hover,.term:focus-visible{text-decoration-style:solid}
.ruletext p{margin:.4em 0}
.ps .term{color:#111 !important;text-decoration:none;font-weight:inherit}

/* Warmind-style stat boxes */
.statblock{display:flex;flex-direction:column;gap:6px}
.mname{font-weight:700;font-size:.85rem;color:var(--muted);margin-top:4px}
.sg6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);min-width:0}
.sbox .sl{font:600 .66rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sbox .sv{font:700 1.35rem/1.1 var(--body);font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sg6.sm .sbox{padding:6px 2px 7px}
.sg6.sm .sbox .sv{font-size:1rem}
.wpn{padding:8px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.wpn:last-child{border-bottom:0}
.wn{font-weight:600;font-size:1rem}
.wkw{display:flex;flex-wrap:wrap;gap:5px}
.wtag{font:600 .68rem var(--body);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid color-mix(in srgb,var(--acc-text,var(--accent)) 55%,transparent);color:var(--acc-text,var(--accent));background:color-mix(in srgb,var(--accent) 10%,transparent)}
button.wtag{cursor:pointer}
@media (max-width:360px){.sbox .sv{font-size:1.1rem}.sg6{gap:4px}}
.ps .sg6{gap:3px}.ps .sbox{background:#eee;border-color:#bbb;padding:3px}.ps .sbox .sv{font-size:13px;color:#111}.ps .sbox .sl{color:#444}.ps .wpn{padding:4px 0;gap:3px}.ps .wtag{color:#111;border-color:#999;background:none}

/* Stat boxes stand out: darker plate, army-colour top edge, soft shadow */
:root{--stat-bg:color-mix(in srgb,var(--panel2) 84%,var(--text));--stat-sh:0 2px 6px rgba(40,25,5,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stat-bg:color-mix(in srgb,var(--panel2) 50%,#000);--stat-sh:0 3px 10px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--stat-bg:color-mix(in srgb,var(--panel2) 50%,#000);--stat-sh:0 3px 10px rgba(0,0,0,.55)}
.sbox{background:var(--stat-bg);border:1px solid color-mix(in srgb,var(--line) 70%,#000);border-top:3px solid var(--accent2,var(--accent));box-shadow:var(--stat-sh),inset 0 1px 0 rgba(255,255,255,.05)}
.sbox .sl{color:var(--acc-text,var(--accent));opacity:.9}
.sbox .sv{font-size:1.45rem}
.sg6.sm .sbox{border-top-width:2px}
.sg6.sm .sbox .sv{font-size:1.05rem}
.ps .sbox{box-shadow:none;border-top:2px solid #555}
.sbox.long .sv,.sg6.sm .sbox.long .sv{font-size:.82rem;letter-spacing:-.01em}

/* Points breakdown */
.pbreak{display:flex;flex-direction:column;gap:6px}
.pbar2{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.pbar2 i{display:block;height:100%}
.plegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.plegend b{color:var(--text);font-weight:600}
.plegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* Phase helper */
.srow.nocp{opacity:.55}
.cpnote{font-size:.85rem;color:var(--muted)}
.abwho{font-size:.75rem;color:var(--muted);font-weight:500}
/* Bookmarks */
.star{background:none;border:0;padding:2px 4px;font-size:1.15rem;line-height:1;color:var(--muted);cursor:pointer}
.star.on{color:var(--warn)}
.srow > summary .star{grid-row:1;grid-column:3}
.srow > summary{grid-template-columns:1fr auto auto}
/* Compare */
.cmp{width:100%;border-collapse:collapse;font-size:.88rem}
.cmp th,.cmp td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp .up{color:var(--ok);font-weight:700}.cmp .down{color:var(--err);font-weight:700}
/* QR */
.qrbox{background:#fff;padding:14px;border-radius:12px;align-self:center;line-height:0}
.qrbox svg{width:min(78vw,300px);height:auto;display:block}
.sharedhead{display:flex;flex-direction:column;gap:4px}

/* Player colours in the Game tab: you = blue, opponent = red */
:root{--pl-me:#3f7fd9;--pl-opp:#d6453b}
.card.pl-me,.card.pl-opp{border-left:5px solid var(--pl);background:color-mix(in srgb,var(--pl) 9%,var(--panel)) !important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pl) 35%,transparent)}
.pl-me{--pl:var(--pl-me)}.pl-opp{--pl:var(--pl-opp)}
.card.pl-me > .row h3,.card.pl-opp > .row h3,.card.pl-me .sec-h,.card.pl-opp .sec-h{color:color-mix(in srgb,var(--pl) 80%,var(--text)) !important}
.card.pl-me .sec-h,.card.pl-opp .sec-h{border-bottom-color:color-mix(in srgb,var(--pl) 45%,transparent)}
.card.pl-me .seg button[aria-pressed="true"],.card.pl-opp .seg button[aria-pressed="true"],.card.pl-me .btn.primary,.card.pl-opp .btn.primary{background:var(--pl);border-color:var(--pl);color:#fff}
.card.pl-me .mcard .kind,.card.pl-opp .mcard .kind{color:var(--pl)}
.card.pl-me input[data-in="gname"],.card.pl-opp input[data-in="gname"]{border-color:var(--pl);color:color-mix(in srgb,var(--pl) 80%,var(--text))}
.pl-me-t{color:var(--pl-me) !important}.pl-opp-t{color:var(--pl-opp) !important}
input.pl-me-in{border-color:color-mix(in srgb,var(--pl-me) 55%,var(--line));background:color-mix(in srgb,var(--pl-me) 8%,var(--panel2))}
input.pl-opp-in{border-color:color-mix(in srgb,var(--pl-opp) 55%,var(--line));background:color-mix(in srgb,var(--pl-opp) 8%,var(--panel2))}
.seg button.pl-me-b[aria-pressed="true"]{background:var(--pl-me);color:#fff}
.seg button.pl-opp-b[aria-pressed="true"]{background:var(--pl-opp);color:#fff}

.gds > summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none;padding-right:26px;position:relative}
.gds > summary::-webkit-details-marker{display:none}
.gds > summary::after{content:"▾";position:absolute;right:2px;top:2px;font-size:1.1rem;color:var(--pl);transition:transform .2s}
.gds[open] > summary::after{transform:rotate(180deg)}
.gds-h{font:700 1.05rem var(--display);color:color-mix(in srgb,var(--pl) 80%,var(--text))}

/* stat numbers scale with the space available, so nested panels never cut them off */
.sg6{container-type:inline-size}
.sbox .sv{font-size:clamp(.85rem,7.2cqi,1.45rem) !important}
.sg6.sm .sbox .sv{font-size:clamp(.8rem,5.6cqi,1.05rem) !important}
.sbox.long .sv,.sg6.sm .sbox.long .sv{font-size:clamp(.6rem,3.7cqi,.85rem) !important;letter-spacing:-.02em;text-overflow:clip}
.sbox{padding-left:1px;padding-right:1px}

.rolepick{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--trim);border-radius:var(--r)}
.rolebtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px}
.rolebtn .small{font-weight:400;opacity:.8}
.rolelab{display:block;font:700 .66rem var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.pl-me-pill{border-color:var(--pl-me);color:var(--pl-me)}.pl-opp-pill{border-color:var(--pl-opp);color:var(--pl-opp)}

.trkbox{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--pl,var(--accent)) 10%,var(--panel2));border:1px solid color-mix(in srgb,var(--pl,var(--accent)) 40%,var(--line))}
.trkbox.dead{opacity:.75;border-style:dashed}
.trk{display:flex;align-items:center;gap:6px}
.trk-l{font:700 .68rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);max-width:92px;line-height:1.15}
.trk-b{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:1.2rem;line-height:1;cursor:pointer;color:var(--text)}
.trk-v{font:700 1.2rem var(--body);min-width:38px;text-align:center}
.trk-v small{font-size:.75rem;color:var(--muted);font-weight:500}
.mcard summary .pill{margin-left:auto}

.segwrap{flex-wrap:wrap;overflow:visible}

.vptot{text-align:center;font-size:1.9rem;padding-top:6px;border-top:2px solid var(--line)}
.tot-l{padding-top:10px;border-top:2px solid var(--line)}

.fold > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"▾";margin-left:auto;font-size:1rem;transition:transform .2s}
.fold:not([open]) > summary::after{transform:rotate(-90deg)}
.fold[open] > summary{margin-bottom:6px}
.battle-missions > .card{background:color-mix(in srgb,var(--panel2) 60%,var(--panel))}

.foldcard > summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px;padding-right:26px;position:relative}
.foldcard > summary::-webkit-details-marker{display:none}
.foldcard > summary::after{content:"▾";position:absolute;right:2px;top:2px;font-size:1.1rem;color:var(--pl,var(--accent));transition:transform .2s}
.foldcard:not([open]) > summary::after{transform:rotate(-90deg)}
.foldcard > summary h3{margin:0}
.card.pl-me > summary h3,.card.pl-opp > summary h3{color:color-mix(in srgb,var(--pl) 80%,var(--text))}
.oppstrats > summary{color:color-mix(in srgb,var(--pl-opp) 80%,var(--text)) !important;border-bottom-color:color-mix(in srgb,var(--pl-opp) 45%,transparent) !important}
.turnbar{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:7;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--pl);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:720px;margin:0 auto}
.turnbar .tb-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}

.attbox{border:2px solid var(--trim);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--trim) 6%,transparent)}
.attbox-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.attbox-h .kind{font:700 .7rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--trim)}
.rulesbox{border-style:dashed}

.odds{font-size:.82rem;padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 10%,var(--panel2));border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line))}
.calcres{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:var(--r);background:var(--stat-bg);border:1px solid var(--line);border-top:3px solid var(--accent2,var(--accent))}
.crow{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.crow b{font-variant-numeric:tabular-nums}
.crow.big2{font-size:1.15rem;padding-top:4px;border-top:1px solid var(--line)}
.crow small{font-size:.75rem;color:var(--muted)}
.calcopts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:380px){.calcopts{grid-template-columns:1fr}}

/* Game tab: more breathing room on phones */

.sbox .sv{overflow:hidden !important;text-overflow:clip !important;white-space:nowrap;max-width:100%;letter-spacing:-.01em}
.sbox{padding-left:2px !important;padding-right:2px !important}

/* Game header: versus banner */
header.top.vstop{padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.vsban{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:0;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px var(--shade)}
.vs-side{position:relative;display:flex;align-items:center;gap:6px;padding:8px;min-height:68px;color:#fff;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 85%,transparent),color-mix(in srgb,var(--accent) 35%,transparent)),var(--scene,none) center/cover,var(--accent)}

.vs-opp.custom{background:linear-gradient(270deg,rgba(0,0,0,.55),rgba(0,0,0,.2)),var(--scene) center/cover,var(--accent)}
.vs-me{box-shadow:inset 0 -3px 0 var(--pl-me)}.vs-opp{box-shadow:inset 0 -3px 0 var(--pl-opp)}

@supports (-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}
.bannerwrap{position:relative}
.sharebig{position:absolute;top:50%;right:0;transform:translateY(-50%);z-index:3;display:inline-flex;align-items:center;gap:7px;padding:10px 16px;min-height:44px;border-radius:999px;font:700 1rem var(--display);letter-spacing:.03em;color:var(--on-accent);background:var(--accent);border:1.5px solid color-mix(in srgb,var(--trim,var(--accent)) 70%,#fff);box-shadow:0 3px 12px rgba(0,0,0,.5);cursor:pointer}
.sharebig:active{transform:translateY(-50%) scale(.96)}.brand{position:relative}
details.sectfold{display:block}
.sectfold > summary{cursor:pointer;list-style:none;position:relative;padding-right:28px;align-items:center}
.sectfold > summary::-webkit-details-marker{display:none}
.sectfold > summary::after{content:"▾";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:1.1rem;color:var(--acc-text,var(--accent));transition:transform .2s}
.sectfold:not([open]) > summary::after{transform:translateY(-50%) rotate(-90deg)}
.sect-b{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.autotag{font:600 .7rem var(--ui,inherit);text-transform:none;letter-spacing:0;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text);margin-left:6px}
.abfx{align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.abfx .abtx{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.35}
.abfx.abdef b::after{content:" (defence)";font-weight:400;font-size:.75rem;color:var(--muted)}
.abfxbox summary{font-weight:700}
.brief .srow.brow > summary .sname{white-space:normal}
.bgrid{display:grid;gap:8px;padding:6px 0 8px}
.bh{font:700 .72rem var(--ui,inherit);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.rng{display:block;font-size:.88rem;padding:2px 0}.rng b{display:inline-block;min-width:3.2em;color:var(--acc-text,var(--accent))}
.rng .half{font-size:.75rem;color:var(--muted);margin-left:4px}
.brow2{padding:6px 0;border-top:1px solid var(--line)}.brow2:first-child{border-top:0}.brow2 .pill{margin:3px 3px 0 0}
.bonce{padding:6px 0;border-top:1px solid var(--line)}.bonce.used span{opacity:.5;text-decoration:line-through}
.unit-ds{display:flex;flex-direction:column;gap:12px;margin:2px 0 8px}
.unit-ds > .small{margin-top:-4px}
.unit-ds .dsfold > .sec-h{margin:0}
.unit-edit > summary{font-weight:700;padding:10px 0}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 6px}
.cp{display:flex;flex-direction:column;align-items:center;padding:4px 0;border-radius:6px;font-size:.78rem;background:var(--panel2);border:1px solid var(--line)}
.cp b{font-size:.9rem}.cp.hi{background:color-mix(in srgb,#2f9e5b 28%,var(--panel2))}.cp.mid{background:color-mix(in srgb,#d4a845 26%,var(--panel2))}.cp.lo{opacity:.75}
.cmod{font-weight:700;color:var(--acc-text,var(--accent));text-transform:none;letter-spacing:0;margin-left:6px}
.cused{margin-top:6px}.cused div,.cmaybe div{padding:2px 0}
.rrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}.rrow:first-child{border-top:0}
.rrow .rn{grid-column:1/-1;font-weight:600}.rv{display:flex;align-items:center;gap:6px;grid-column:1/-1;flex-wrap:wrap}
.rl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:4.5em}
.rc{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.rc.hi{background:color-mix(in srgb,#2f9e5b 30%,var(--panel2))}.rc.mid{background:color-mix(in srgb,#d4a845 30%,var(--panel2))}.rc.lo{background:color-mix(in srgb,#c0392b 22%,var(--panel2))}.rc.no{opacity:.6}
.rdist input{max-width:110px}
/* iOS home-screen app: with the translucent status bar, fixed bottom bars sit one status-bar height too high on launch. Making the page at least screen + status bar tall fixes it. */
@media (display-mode: standalone){html{min-height:calc(100% + env(safe-area-inset-top))}body{min-height:calc(100dvh + env(safe-area-inset-top))}}

.gp{padding:8px 0;border-top:1px solid var(--line)}.gp:first-of-type{border-top:0}
.gp-h{margin-bottom:2px}.gp.ok .gp-h{color:color-mix(in srgb,#2f9e5b 70%,var(--text))}.gp.warn .gp-h{color:color-mix(in srgb,#d4a845 80%,var(--text))}
.gp .small{margin-top:2px}
ul.tips{margin:6px 0 4px;padding-left:18px}ul.tips li{margin:4px 0;font-size:.9rem;line-height:1.4}
.tzone{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.tz{font-size:.78rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.tz.g{background:color-mix(in srgb,#2f9e5b 30%,var(--panel2))}.tz.b{background:color-mix(in srgb,#3a7bd5 28%,var(--panel2))}.tz.b2{background:color-mix(in srgb,#3a7bd5 16%,var(--panel2))}.tz.r{background:color-mix(in srgb,#c0392b 26%,var(--panel2))}

/* ===== Bigger screens ===== */
.buildv,.gwide{display:flex;flex-direction:column;gap:14px}
.listgrid{display:flex;flex-direction:column;gap:10px}
.briefgrid{display:flex;flex-direction:column;gap:12px}
/* Split screen / small tablet: the phone layout, centred at a comfortable width */
@media (min-width:600px){
  main{max-width:820px;margin:0 auto;width:100%;box-sizing:border-box;padding-left:20px;padding-right:20px}
  .sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:88%}
  .turnbar{left:max(8px,calc(50% - 400px));right:max(8px,calc(50% - 400px))}
  .toast{max-width:520px}
}
@media (min-width:700px){
  .listgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
/* Full tablet: two columns */
@media (min-width:900px){
  main{max-width:1320px;padding-left:24px;padding-right:24px}
  .buildv{display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr);grid-template-areas:"a u" "z u";grid-template-rows:auto 1fr;gap:16px 22px;align-items:start}
  .buildv > .ba{grid-area:a}.buildv > .bu{grid-area:u}.buildv > .bz{grid-area:z;align-self:start}
  .buildv > .ba,.buildv > .bz{position:relative}
  .gamev.gwide{display:grid !important;grid-template-columns:minmax(360px,460px) minmax(0,1fr);grid-template-areas:"g1 ds" "g2 ds";grid-template-rows:auto 1fr;gap:16px 22px;align-items:start}
  .gamev.gwide > *{margin-top:0 !important}.gwide > .g1{grid-area:g1}.gwide > .gds-col{grid-area:ds;position:sticky;top:calc(var(--toph,110px) + 12px);max-height:calc(100dvh - var(--toph,110px) - var(--navh,70px) - 96px);overflow-y:auto;overscroll-behavior:contain;border-radius:12px}.gwide > .g2{grid-area:g2;align-self:start}
  .briefgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:14px}
  .listgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{max-width:860px}
  .turnbar{left:max(8px,calc(50% - 460px));right:max(8px,calc(50% - 460px))}
}

  "BLACK TEMPLARS":["Templar Vows","Heirs of Sigismund"], "DEATHWATCH":["Mission Tactics","Kill Teams","Deathwatch"] };
function armyOptions(){

  const placed = new Set(["SM"]);

const WAHA = "https://wahapedia.ru/wh40k10ed/";

const groupOf = (id, army) => isAlly(id, army) ? "Imperial Agents" : roleOf(id);
const catLabel = (g, army) => g === "Walkers" && fidOf(army) === "SM" ? "Dreadnoughts" : g;

/* ============ helpers ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const plain = html => { const d = document.createElement("div"); d.innerHTML = String(html||"").replace(/<br\s*\/?>/gi," "); return (d.textContent||"").replace(/\s+/g," ").trim(); };
let toastT;
function toastAction(msg, label, fn){
  toast(msg); const t = $("#toast"); if (!t) return;
  const b = document.createElement("button"); b.className = "toastbtn"; b.textContent = label;
  b.onclick = () => { fn(); t.hidden = true; }; t.appendChild(b); clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);

function toast(msg){ let t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

const ALLOWED = new Set(["B","STRONG","I","EM","U","BR","P","DIV","SPAN","UL","OL","LI","TABLE","THEAD","TBODY","TR","TD","TH","SUP","SUB","H4","H5"]);
function sanitize(html){
  const t = document.createElement("template");
  t.innerHTML = String(html||"");
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 1) {
        walk(ch);
        if (!ALLOWED.has(ch.tagName)) { ch.replaceWith(...ch.childNodes); }
        else { [...ch.attributes].forEach(a => { if (a.name !== "colspan" && a.name !== "rowspan") ch.removeAttribute(a.name); }); }
      } else if (ch.nodeType !== 3) ch.remove();
    });
  };
  walk(t.content);
  if (!sanitize.noTerms) linkTerms(t.content);
  return t.innerHTML;
}
/* ============ rule terms: bold, tap to read ============ */
let TERMS = null;
function termIndex(){
  if (TERMS && TERMS.g === G) return TERMS;
  TERMS = { g:G, list:[], ci:null, cs:null };
  if (!G) return TERMS;
  const add = (key, pat, cs) => { try { TERMS.list.push({ key, rx:new RegExp("^(?:" + pat + ")$", cs ? "" : "i"), pat, cs }); } catch {} };
  Object.entries(G.terms || {}).forEach(([k, t]) => { if (t.pattern) add("t:" + k, t.pattern, t.cs); });
  Object.entries(G.weapon || {}).forEach(([k, w]) => { if (/\s|-/.test(w.name)) add("w:" + k, w.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+"), false); });
  const join = arr => arr.length ? new RegExp("(?<![\\w-])(?:" + arr.map(x => x.pat).sort((a,b) => b.length - a.length).join("|") + ")(?![\\w-])", "g" + (arr[0].cs ? "" : "i")) : null;
  TERMS.ci = join(TERMS.list.filter(x => !x.cs)); TERMS.cs = join(TERMS.list.filter(x => x.cs));
  return TERMS;
}
function linkTerms(root, skip){
  if (S.settings.terms === false) return;
  const T = termIndex(); if (!T.list.length) return;
  const nodes = []; const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  while (tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n => {
    const txt = n.nodeValue; if (!txt || txt.length < 3) return;
    const hits = [];
    [T.ci, T.cs].forEach(rx => { if (!rx) return; rx.lastIndex = 0; let m; while ((m = rx.exec(txt))) { hits.push([m.index, m[0]]); if (!m[0].length) rx.lastIndex++; } });
    if (!hits.length) return;
    hits.sort((a,b) => a[0] - b[0] || b[1].length - a[1].length);
    const frag = document.createDocumentFragment(); let pos = 0, used = 0;
    hits.forEach(([i, w]) => {
      if (i < pos) return;
      const t = T.list.find(x => x.rx.test(w)); if (!t || t.key === skip) return;
      frag.append(txt.slice(pos, i));
      const b = document.createElement("button"); b.className = "term"; b.dataset.act = "term"; b.dataset.k = t.key; b.textContent = w; frag.append(b);
      pos = i + w.length; used++;
    });
    if (!used) return;
    frag.append(txt.slice(pos)); n.replaceWith(frag);
  });
}
function termRich(text, skip){
  const t = document.createElement("template");
  t.innerHTML = String(text||"").split(/\n{2,}/).map(p => "<p>" + esc(p) + "</p>").join("");
  linkTerms(t.content, skip); return t.innerHTML;
}
function coreRefHtml(q, opt = {}){
  if (!G || !G.terms) return `<div class="small muted">Load your Rules glossary file on the Settings tab to see the Core Rules here.</div>`;
  q = lc(q || "").trim();
  const all = Object.entries(G.terms).map(([k, t]) => ({ k, ...t })).sort((a, b) => a.name.localeCompare(b.name));
  const hits = q ? all.filter(t => lc(t.name).includes(q) || lc(t.text).includes(q)).sort((a, b) => (lc(b.name).includes(q) - lc(a.name).includes(q)) || a.name.localeCompare(b.name)) : all;
  return hits.length ? hits.map(t => `<details class="srow"><summary><span class="sname">${esc(t.name)}</span>${starBtn("term:" + t.k, t.name)}</summary><div class="rich ruletext">${termRich(t.text, "t:" + t.k)}</div></details>`).join("")
    : `<div class="small muted">No core rule matches "${esc(q)}". Your Core Rules PDF ends partway through the terrain section, so Ruins, Woods and Objective markers aren't included.</div>`;
}
function showTerm(key){
  if (!G) return;
  const [kind, k] = [key.slice(0,1), key.slice(2)];
  if (kind === "w") return showRule(k);
  const t = (G.terms||{})[k]; if (!t) return;
  openSheet("rule", t.name, `<div class="row"><div class="small muted grow">Core Rules</div>${starBtn("term:" + k, t.name)}</div><div class="rich ruletext">${termRich(t.text, key)}</div>`);
}

/* ============ CSV (Wahapedia: '|' delimited, UTF-8, trailing '|') ============ */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const nl = text.indexOf("\n");
  if (nl < 0) return [];
  let headerLine = text.slice(0, nl).replace(/\r$/,"");
  const trailing = headerLine.endsWith("|");
  const headers = headerLine.split("|").map(h => h.trim().toLowerCase());
  if (trailing) headers.pop();
  const n = headers.length, rows = [];
  const body = text.slice(nl+1);
  if (trailing) {
    const tok = body.split("|");
    let i = 0;
    while (i + n <= tok.length) {
      const f = tok.slice(i, i+n);
      f[0] = f[0].replace(/^[\r\n]+/, "");
      if (!(n === 1 ? f[0] : f.join("")).trim() && i + n >= tok.length - 1) break;
      const o = {}; headers.forEach((h,k) => o[h] = (f[k]||"").trim()); rows.push(o);
      i += n;
    }
  } else {
    body.split(/\r?\n/).forEach(line => {
      if (!line.trim()) return;
      const f = line.split("|"); const o = {}; headers.forEach((h,k) => o[h] = (f[k]||"").trim()); rows.push(o);
    });
  }
  return rows;
}
const fileKey = name => name.toLowerCase().replace(/\.(csv|txt)$/,"").replace(/\s*\(\d+\)$/,"").replace(/-\d+$/,"").trim();

/* ============ data index ============ */
let D = null; // indexed data
function buildIndex(raw){
  const I = { raw };

    const m = {};

    Object.values(m).forEach(a => a.sort((x,y) => num(x.line)-num(y.line) || num(x.line_in_wargear)-num(y.line_in_wargear)));
    return m;
  };

  I.ds = {}; (raw.datasheets||[]).forEach(r => I.ds[r.id] = r);

  I.opts = grp(raw.datasheets_options); I.wg = grp(raw.datasheets_wargear); I.comp = grp(raw.datasheets_unit_composition);

  (raw.datasheets_abilities||[]).filter(a => /attached units/i.test(a.name||"")).forEach(a => {
    const m = plain(a.description).match(/attached to (?:an? |the )?(.+?), it can also be attached to this unit/i);
    if (!m) return;
    const tgt = byName[normName(m[1])] || byName[normName(m[1].replace(/s$/,""))] || byName[normName(m[1] + " squad")] || [];
    for (const L in I.lead) if (tgt.some(t => I.lead[L].includes(t)) && !I.lead[L].includes(a.datasheet_id)) I.lead[L].push(a.datasheet_id);
  });
  I.enhDs = {}; (raw.datasheets_enhancements||[]).forEach(r => { (I.enhDs[r.enhancement_id] ||= new Set()).add(r.datasheet_id); });
  I.abilities = {}; (raw.abilities||[]).forEach(r => I.abilities[r.id] = r);
  I.enh = raw.enhancements || []; I.enhById = {}; I.enh.forEach(e => I.enhById[e.id] = e);
  I.strat = raw.stratagems || []; I.detAb = raw.detachment_abilities || []; I.dets = raw.detachments || [];

}
function armyRules(army){
  const seen = new Map();
  Object.keys(D.ds).filter(id => eligible(id, army)).forEach(id => (D.abil[id]||[]).forEach(r => {
    if (!/faction/i.test(r.type||"")) return;
    const g = r.ability_id && D.abilities[r.ability_id]; const name = r.name || (g && g.name);
    if (name && !seen.has(name)) seen.set(name, { name, description: (g && g.description) || r.description });
  }));
  const fid = fidOf(army), ch = chapterOf(army);
  Object.values(D.abilities).filter(a => a.faction_id === fid && (fid !== "SM" || a.name === "Space Marine Chapters" || (CHAPTER_RULES[ch]||[]).includes(a.name)))
    .forEach(a => { if (!seen.has(a.name)) seen.set(a.name, a); });
  return [...seen.values()];
}
const isLegends = id => { const s = D.sources[D.ds[id]?.source_id]; return !!s && /legend/i.test(s.name + " " + (s.type||"")); };
function roleOf(id){
  const k = D.kwSet[id] || new Set();
  if (k.has("EPIC HERO")) return "Epic Heroes";
  if (k.has("CHARACTER")) return "Characters";
  if (k.has("BATTLELINE")) return "Battleline";
  if (k.has("DEDICATED TRANSPORT")) return "Dedicated Transports";
  if (k.has("FORTIFICATION")) return "Fortifications";
  if (k.has("VEHICLE") && k.has("WALKER")) return "Walkers";
  if (k.has("VEHICLE")) return "Vehicles";
  if (k.has("MONSTER")) return "Monsters";
  if (k.has("MOUNTED")) return "Mounted";
  if (k.has("BEAST") || k.has("SWARM")) return "Beasts & Swarms";
  if (k.has("INFANTRY")) return "Infantry";
  return "Other units";
}
const IMPERIUM_F = new Set(["SM","AM","AS","AC","AdM","QI","GK"]);
const isAlly = (id, army) => { const d = D.ds[id]; return !!d && d.faction_id === "AoI" && fidOf(army) !== "AoI" && IMPERIUM_F.has(fidOf(army)); };
function eligible(id, army){
  const d = D.ds[id]; if (!d) return false;
  if (d.faction_id !== fidOf(army) && !isAlly(id, army)) return false;
  if (String(d.virtual).toLowerCase() === "true") return false;

  if (fidOf(army) === "SM" && d.faction_id === "SM") {
    const k = D.kwSet[id] || new Set(), mine = chapterOf(army);

  }

}
let costCtx = null; /* the army whose prices apply; Agents of the Imperium cost more as allies */
const costRows = id => { let rows = (D.cost[id]||[]).filter(r => !/^\s*\+/.test(r.cost));
  if (rows.some(r => /assigned agent/i.test(r.description)) && rows.some(r => /detachment\)/i.test(r.description))) {
    const army = costCtx || (curList() && curList().army) || "", pure = fidOf(army) === "AoI";
    rows = rows.filter(r => pure ? !/assigned agent/i.test(r.description) : /assigned agent/i.test(r.description)); }
  return rows.map(r => ({ line:r.line, label:r.description.replace(/\s*\((<ky>)?AGENTS OF THE IMPERIUM(<\/ky>)? Detachment\)|\s*\(Assigned Agent\)/i, ""), cost:num(r.cost) })); };
/* Optional extra models priced as "+N" (e.g. Bike Squad + Attack Bike) are add-ons, not unit sizes. */
const addonRows = id => (D.cost[id]||[]).filter(r => /^\s*\+/.test(r.cost)).map(r => ({ line:r.line, label:r.description, cost:num(r.cost) }));
const addonsOf = u => addonRows(u.ds).filter(a => u.addons && u.addons[a.line]);
function maxOf(id){

}
function detachmentsFor(army){
  const fid = fidOf(army);
  const out = new Map();
  if (D.dets.length) D.dets.filter(d => d.faction_id === fid && !/boarding/i.test(d.type||"")).forEach(d => out.set(d.id, { key:d.id, name:d.name }));
  if (!out.size) {
    [...D.enh, ...D.detAb, ...D.strat].filter(r => r.faction_id === fid && r.detachment).forEach(r => {
      const key = r.detachment_id || r.detachment; if (!out.has(key)) out.set(key, { key, name:r.detachment });
    });

  const mine = chapterOf(army);
  if (fid !== "SM") return [...out.values()].sort((a,b) => a.name.localeCompare(b.name));

const LEADER_RE = /\b(sergeant|champion|nob|boss nob|exarch|superior|shas[’']ui|alpha|prime|hekatrix|sybarite|aspiring|veteran sergeant|lieutenant|leader|brother-sergeant|sister superior|kaptin)\b/i;

/* How many models may take an option: "up to N" or "for every K models" (null when it's just one). */

function wgPicks(u){

  optsOf(u.ds).forEach(o => {
    const v = u.wg ? u.wg[o.line] : ((u.opts||[]).includes(o.line) ? true : undefined);

/* ============ import a list from text ============ */
const PTS_RE = /(\d{2,4})\s*(?:pts?|points?)\b/i;
const lc = t => String(t||"").toLowerCase().replace(/[’‘]/g, "'");
function unitLinesFor(army, lines){
  const names = Object.keys(D.ds).filter(id => eligible(id, army)).map(id => ({ id, n: lc(D.ds[id].name) })).sort((a,b) => b.n.length - a.n.length);
  const hits = [];
  lines.forEach((line, i) => {
    const m = line.match(PTS_RE) || line.match(/\[(\d{2,4})\]/); if (!m) return;
    if (/^[\s+=*#-]*(battle size:\s*)?(strike force|incursion|onslaught|combat patrol)\b/i.test(line)) return;
    const L = lc(line), before = L.slice(0, L.indexOf(lc(m[0])) + 1 || L.length);
    const f = names.find(x => { const k = before.indexOf(x.n); return k >= 0 && !/[a-z]/.test(before[k + x.n.length] || " ") && !/[a-z]/.test(before[k-1] || " "); });

}

    const hits = unitLinesFor(o.key, lines);
    let score = hits.length * 10 + (T.includes(lc(o.name)) ? 5 : 0) + (o.key === "SM" ? -1 : 0);
    if (!best || score > best.score) best = { army:o.key, hits, score };
  });

  const det = detachmentsFor(army).filter(d => T.includes(lc(d.name))).sort((a,b) => b.name.length - a.name.length)[0] || null;
  const enhs = det ? detEnh(army, det) : D.enh.filter(e => e.faction_id === fidOf(army));
  const sz = text.match(/^\s*(Incursion|Strike Force|Onslaught)\b\s*(?:\(|$)/im);
  let points = sz ? ({ incursion:1000, "strike force":2000, onslaught:3000 })[sz[1].toLowerCase()] : 2000;

    const all = lc(lines[h.i] + "\n" + block.join("\n"));
    const u = { uid:uid(), ds:h.id, name:D.ds[h.id].name, line:null, enh:null, warlord:/\bwarlord\b/.test(all), lead:null, opts:[], wg:{}, notes:"" };
    const e = enhs.filter(x => all.includes(lc(x.name))).sort((a,b) => b.name.length - a.name.length)[0];
    if (e) { u.enh = e.id; if (!det) u._det = e; }
    const rows = costRows(h.id);
    const sizeM = all.match(/(\d+)\s*models?/);
    const byPts = rows.find(r => r.cost === h.pts - (e ? num(e.cost) : 0)) || rows.find(r => r.cost === h.pts);
    const bySize = sizeM && rows.find(r => parseInt(plain(r.label)) === +sizeM[1]);
    u.line = (byPts || bySize || rows[0] || {}).line || null;
    addonRows(h.id).forEach(ad => { if (all.includes(lc(plain(ad.label)))) (u.addons ||= {})[ad.line] = 1; });
    if (!byPts && !u.addons && addonRows(h.id).length) { /* work out add-on models from the points (e.g. Simple format) */
      const ads = addonRows(h.id), want = h.pts - (e ? num(e.cost) : 0);
      for (const r of rows) { for (let mask = 1; mask < (1 << ads.length); mask++) { const pick = ads.filter((_, i) => mask & (1 << i)); if (r.cost + pick.reduce((x, a) => x + a.cost, 0) === want) { u.line = r.line; u.addons = {}; pick.forEach(a => u.addons[a.line] = 1); break; } } if (u.addons) break; }

    const stems = new Set((D.wg[h.id]||[]).map(w => wStem(w.name)).filter(Boolean));

    const extra = block.map(x => x.replace(/^[\s•\-–*◦]+/, "").trim()).filter(x => x && !/^warlord$/i.test(x) && !/^enhancement/i.test(x) && !/^leading:/i.test(x));

  const det2 = det || (detFromEnh ? detachmentsFor(army).find(d => matchDet(units.find(u => u._det)._det, d)) : null);
  const l = { id:uid(), name:(title.replace(PTS_RE, "").replace(/[()\[\]+]/g, "").trim() || armyName(army) + " import").slice(0, 60), army, armyName:armyName(army), points, det:det2 || null, units, created:Date.now(), updated:Date.now() };
  units.forEach(u => { if (u._lead) { const t = units.find(x => x !== u && lc(unitLabel(l, x)) === lc(u._lead)) || units.find(x => x !== u && lc(u._lead).startsWith(lc(D.ds[x.ds].name))); if (t && (D.lead[u.ds]||[]).includes(t.ds)) u.lead = t.uid; } delete u._lead; delete u._det; });

  const used = new Set(hits.map(h => h.i));
  const missed = lines.filter((x, i) => !used.has(i) && (x.match(PTS_RE) || x.match(/\[(\d{2,4})\]/)) && !/strike force|incursion|onslaught|combat patrol/i.test(x) && i > 0).map(x => x.trim()).filter(x => !/^\S.*\(\d+\s*points?\)$/i.test(x) || unitLinesFor(army,[x]).length === 0).slice(0, 12);

}

const SHARE_FMTS = [["qr","QR / link"],["bb","Bear Bones"],["gw","Warhammer app"],["tour","Tournament"],["nr","New Recruit"],["short","Short"],["simple","Simple"]];
function shareOpts(){ return Object.assign({ constant:true, header:true, discord:false, player:"", team:"" }, S.shareOpt || LS.get("shareOpt", {})); }
function loadoutNames(u){
  const st = unitWeapons(u), seen = new Set(), out = [];
  (D.wg[u.ds]||[]).forEach(w => { const nm = w.name.replace(/\s+[–-]\s+.*$/, "").trim(); if ((!st || st.has(wStem(w.name))) && !seen.has(lc(nm))) { seen.add(lc(nm)); out.push(nm); } });
  return out;
}
function unitWounds(u){ return Math.max(1, num((D.models[u.ds]||[])[0]?.w) || 1) * Math.max(1, unitModels(u)); }
function exportExtra(l, fmt, o){
  const v = validate(l), units = l.units.filter(u => D.ds[u.ds]), out = [];
  const fac = D.factions.find(f => f.id === fidOf(l.army));
  const allegName = { imperium:"Imperium", chaos:"Chaos", xenos:"Xenos" }[allegOf(l.army)];
  const facLine = [allegName, fac ? (fac.id === "SM" ? "Adeptus Astartes" : fac.name) : "", chapterOf(l.army) ? armyName(l.army, l) : ""].filter(Boolean).join(" - ");
  const rules = l.det ? detRules(l.army, l.det) : [];
  const detLine = l.det ? l.det.name + (rules[0] ? ` (${rules[0].name})` : "") : "None";
  const chars = units.filter(u => D.kwSet[u.ds]?.has("CHARACTER"));
  const wl = units.find(u => u.warlord);
  const sz = u => { const rows = costRows(u.ds), r = rows.find(x => x.line === u.line) || rows[0]; return r ? plain(r.label) : ""; };
  const pts = u => unitCost(u) + enhCost(u);
  const gear = u => {
    const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
    const one = unitModels(u) === 1, picks = wgPicks(u).map(p => cap(p.short.replace(/^1\s+/, "")));
    const base = o.constant ? loadoutNames(u) : picks;
    return [...addonsOf(u).map(a => "+ " + plain(a.label)), ...base.map(n => (one ? "1x " : "") + n)];
  };
  const extras = u => { const e = u.enh && D.enhById[u.enh], ld = u.lead && l.units.find(x => x.uid === u.lead);
    return [u.warlord ? "Warlord" : "", e ? `Enhancement: ${e.name} (+${num(e.cost)} pts)` : "", ld ? `Attached to: ${unitLabel(l, ld)}` : ""].filter(Boolean); };
  if (o.player) out.push(`Player: ${o.player}`); if (o.team) out.push(`Team: ${o.team}`); if (o.player || o.team) out.push("");
  if (fmt === "tour") {
    if (o.header) {
      const bid = units.filter(u => D.kwSet[u.ds]?.has("VEHICLE") || D.kwSet[u.ds]?.has("MONSTER")).map(u => { const w = unitWounds(u); return 2 + (w >= 15 ? 2 : 0) + (w >= 20 ? 2 : 0); });
      const bc = {}; bid.forEach(x => bc[x] = (bc[x]||0) + 1);
      const line = "+".repeat(47);
      out.push(line, `+ FACTION KEYWORD: ${facLine}`, `+ DETACHMENT: ${detLine}`, `+ TOTAL ARMY POINTS: ${v.total}pts`, "+",
        `+ WARLORD: ${wl ? "Char" + (chars.indexOf(wl) + 1) + ": " + D.ds[wl.ds].name : "None"}`, `+ NUMBER OF UNITS: ${units.length}`,
        `+ SECONDARY: - Bring It Down: ${Object.keys(bc).sort().map(k => `(${bc[k]}x${k})`).join(" + ") || "none"} - Assassination: ${chars.length} Character${chars.length === 1 ? "" : "s"}`, line, "");
    }
    const grp = u => { const g = roleOf(u.ds); return g === "Epic Heroes" || g === "Characters" ? "CHARACTER" : g === "Battleline" ? "BATTLELINE" : g === "Dedicated Transports" ? "DEDICATED TRANSPORT" : "OTHER DATASHEETS"; };
    ["CHARACTER","BATTLELINE","DEDICATED TRANSPORT","OTHER DATASHEETS"].forEach(g => { const us = units.filter(u => grp(u) === g); if (!us.length) return; out.push(g, "");
      us.forEach(u => { const z = sz(u), many = unitModels(u) > 1;
        out.push(`${chars.includes(u) ? "Char" + (chars.indexOf(u) + 1) + ": " : ""}${D.ds[u.ds].name}${many && z ? " (" + z + ")" : ""} (${pts(u)} pts)`);
        [...gear(u), ...extras(u)].forEach(x => out.push("• " + x)); out.push(""); }); });
  } else if (fmt === "short") {
    if (o.header) out.push(`${l.name} - ${facLine} - ${detLine} - ${v.total}/${l.points} pts`, "");
    units.forEach(u => { const z = sz(u), bits = [...extras(u).map(x => x.replace(/ \(\+\d+ pts\)/, "")), ...gear(u)];
      out.push(`${D.ds[u.ds].name}${unitModels(u) > 1 && z ? " x" + unitModels(u) : ""} (${pts(u)})${bits.length ? ": " + bits.join(", ") : ""}`); });
  } else {
    if (o.header) out.push(`${l.name} (${v.total} pts)`, `${armyName(l.army, l)}${l.det ? " · " + l.det.name : ""}`, "");
    const m = new Map(); units.forEach(u => { const k = D.ds[u.ds].name; const c = m.get(k) || { n:0, p:0 }; c.n++; c.p += pts(u); m.set(k, c); });
    [...m].forEach(([k, c]) => out.push(`${c.n > 1 ? c.n + "x " : ""}${k} (${c.p} pts)`));
  }
  out.push("", "Created with Bear Bones Forge");
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
function exportText(l, fmt){
  if (fmt === "tour" || fmt === "short" || fmt === "simple") return exportExtra(l, fmt, shareOpts());
  if (fmt === "bb") return listText(l);
  const v = validate(l), sz = SIZES.find(x => x.pts === l.points), fac = D.factions.find(f => f.id === fidOf(l.army));
  const r_ = u => { const rows = costRows(u.ds); return rows.find(x => x.line === u.line) || rows[0]; };
  const o_ = shareOpts();
  const picks = u => [...addonsOf(u).map(a => plain(a.label)), ...(o_.constant ? loadoutNames(u) : wgPicks(u).map(p => p.short.replace(/^1\s+/, "")))];
  const grp = u => { const g = roleOf(u.ds); return g === "Epic Heroes" || g === "Characters" ? "CHARACTERS" : g === "Battleline" ? "BATTLELINE" : g === "Dedicated Transports" ? "DEDICATED TRANSPORTS" : "OTHER DATASHEETS"; };
  const order = ["CHARACTERS","BATTLELINE","DEDICATED TRANSPORTS","OTHER DATASHEETS"];
  const units = l.units.filter(u => D.ds[u.ds]);
  const out = [];
  if (o_.player) out.push(`Player: ${o_.player}`); if (o_.team) out.push(`Team: ${o_.team}`); if (o_.player || o_.team) out.push("");
  if (fmt === "gw") {
    if (o_.header) out.push(`${l.name} (${v.total} points)`, "", fac ? fac.name : "", ...(chapterOf(l.army) ? [armyName(l.army, l)] : []), `${sz ? sz.name : "Custom"} (${l.points} points)`, l.det ? l.det.name : "", "");
    order.forEach(g => { const us = units.filter(u => grp(u) === g); if (!us.length) return; out.push("", g, "");
      us.forEach(u => { out.push(`${D.ds[u.ds].name} (${unitCost(u)+enhCost(u)} points)`);
        if (u.warlord) out.push("  • Warlord");
        const e = u.enh && D.enhById[u.enh]; if (e) out.push(`  • Enhancement: ${e.name}`);
        const r = r_(u); if (r && costRows(u.ds).length > 1) out.push(`  • ${plain(r.label)}`);
        picks(u).forEach(p => out.push(`  • 1x ${p}`));
        if (u.lead) { const t = l.units.find(x => x.uid === u.lead); if (t) out.push(`  • Leading: ${unitLabel(l, t)}`); }
        out.push(""); }); });
    out.push("Exported with Bear Bones Forge");
  } else {
    if (o_.header) out.push(`+++ ${l.name} (${fac ? fac.name : armyName(l.army, l)}${chapterOf(l.army) ? " – " + armyName(l.army, l) : ""}) [${v.total} pts] +++`, "",
      `+ Configuration +`, `Battle Size: ${sz ? sz.name : "Custom"} (${l.points} Point limit)`, `Detachment: ${l.det ? l.det.name : "None"}`, "");
    order.forEach(g => { const us = units.filter(u => grp(u) === g); if (!us.length) return; out.push(`++ ${g.charAt(0) + g.slice(1).toLowerCase()} ++`, "");
      us.forEach(u => { const bits = []; if (u.warlord) bits.push("Warlord"); const e = u.enh && D.enhById[u.enh]; if (e) bits.push(`Enhancement: ${e.name}`);
        const r = r_(u); if (r && costRows(u.ds).length > 1) bits.push(plain(r.label)); bits.push(...picks(u));
        if (u.lead) { const t = l.units.find(x => x.uid === u.lead); if (t) bits.push(`Leading: ${unitLabel(l, t)}`); }
        out.push(`${D.ds[u.ds].name} [${unitCost(u)+enhCost(u)} pts]${bits.length ? ": " + bits.join(", ") : ""}`); });
      out.push(""); });
    out.push("Created with Bear Bones Forge");
  }
  return out.join("\n");
}

function printHtml(l){
  const v = validate(l), sz = SIZES.find(x => x.pts === l.points);
  const units = l.units.filter(u => D.ds[u.ds]);
  return `<div class="ps"><h1>${esc(l.name)}</h1><div class="ps-sub">${esc(armyName(l.army, l))}${l.det ? " · " + esc(l.det.name) : ""} · ${sz ? sz.name + " · " : ""}${v.total} / ${l.points} pts</div>
    <table class="ps-roster"><thead><tr><th>Unit</th><th>Size</th><th>Details</th><th>Pts</th></tr></thead><tbody>${units.map(u => { const rows = costRows(u.ds), r = rows.find(x => x.line === u.line) || rows[0]; const e = u.enh && D.enhById[u.enh]; const t = u.lead && l.units.find(x => x.uid === u.lead);
      return `<tr><td><b>${esc(unitLabel(l,u))}</b></td><td>${r ? esc(plain(r.label)) : ""}</td><td>${[u.warlord ? "Warlord" : "", e ? "Enhancement: " + esc(e.name) : "", t ? "Leading " + esc(unitLabel(l,t)) : "", ...wgPicks(u).map(p => esc(p.label))].filter(Boolean).join("; ")}</td><td>${unitCost(u)+enhCost(u)}</td></tr>`; }).join("")}</tbody></table>
    ${l.notes ? `<div class="ps-notes"><b>Notes:</b> ${esc(l.notes)}</div>` : ""}
    ${[...new Set(units.map(u => u.ds))].map(id => { const u = units.find(x => x.ds === id); return `<section class="ps-ds"><h2>${esc(D.ds[id].name)}</h2>${dsBody(id, { weapons: unitWeapons(u), compact:true })}</section>`; }).join("")}
    <div class="ps-foot">Bear Bones Forge · data powered by Wahapedia</div></div>`;
}
function openPrint(){
  const l = curList(); if (!l) return;
  let area = $("#printarea"); if (!area) { area = document.createElement("div"); area.id = "printarea"; document.body.appendChild(area); }
  area.innerHTML = printHtml(l);
  const canPrint = !window.claude;
  openSheet("print", "Printable army sheet", `<p class="small muted" style="margin:0">${canPrint ? "A one-page roster followed by each unit's datasheet with the wargear you picked. Tap Print, or choose Save as PDF in the print window." : "Printing doesn't work inside claude.ai. Open your GitHub version of Bear Bones Forge to print this, or use Copy list."}</p>
    ${canPrint ? `<button class="btn primary" data-act="doprint">Print</button>` : ""}<div class="ps-preview">${printHtml(l)}</div>`);
}

/* ============ rules glossary: tap a keyword ============ */
let G = null; // weapon abilities from the Core Rules (loaded from the glossary file)
function ruleKey(k){ return lc(k).replace(/[\[\]]/g, "").replace(/^anti-.*$/, "anti").replace(/\s*\d+\+?$/, "").replace(/\s*d\d+(\+\d+)?$/, "").replace(/\s+x$/, "").trim(); }
function ruleFor(k){
  const key = ruleKey(k);
  if (G && G.weapon && G.weapon[key]) return { name: G.weapon[key].name, text: G.weapon[key].text, short: G.weapon[key].short, kind: "Weapon ability" };
  if (!D) return null;
  const a = Object.values(D.abilities).find(x => lc(x.name) === key);
  if (a && a.description) return { name: a.name, text: plain(a.description).replace(new RegExp("^" + a.name.toUpperCase()), ""), kind: a.faction_id ? "Army rule" : "Core ability" };
  return null;
}
function showRule(k){
  const r = ruleFor(k); if (!r) return;
  openSheet("rule", r.name, `<div class="row"><div class="small muted grow">${esc(r.kind)}${/\d/.test(k) ? " · " + esc(k) : ""}</div>${starBtn("rule:" + ruleKey(k), r.name)}</div>${r.short ? `<div class="card"><b>In short:</b> ${esc(r.short)}</div>` : ""}<div class="rich ruletext">${termRich(r.text)}</div>`);
}

/* ============ list logic ============ */
function newList(army){
  const l = { id:uid(), name:`${armyName(army)} ${S.lists.filter(x=>x.army===army).length+1}`, army, armyName:armyName(army), points:2000, det:null, units:[], created:Date.now(), updated:Date.now() };
  S.lists.unshift(l); S.cur = l.id; LS.set("cur", S.cur); saveList(l, true); return l;
}
function unitCost(u){
  const rows = costRows(u.ds); if (!rows.length) return 0;
  return (rows.find(r => r.line === u.line) || rows[0]).cost + addonsOf(u).reduce((a, x) => a + x.cost, 0);
}
const enhCost = u => u.enh && D.enhById[u.enh] ? num(D.enhById[u.enh].cost) : 0;
function unitLabel(l, u){
  const same = l.units.filter(x => x.ds === u.ds);
  const nm = D?.ds[u.ds]?.name || u.name || "Unknown unit";
  return same.length > 1 ? `${nm} #${same.indexOf(u)+1}` : nm;
}
function validate(l){ const prev = costCtx; costCtx = l.army; try { return validate0(l); } finally { costCtx = prev; } }
function agentsCheck(l, bad){
  const al = l.units.filter(u => isAlly(u.ds, l.army)); if (!al.length) return;
  const size = l.points <= 1000 ? 0 : l.points <= 2000 ? 1 : 2, name = ["Incursion","Strike Force","Onslaught"][size];
  const cap = { CHARACTER:[1,2,3][size], RETINUE:[1,2,3][size], REQUISITIONED:[1,1,2][size] };
  const has = (u, k) => (D.kwSet[u.ds] || new Set()).has(k);
  const inq = al.filter(u => has(u, "INQUISITOR")).length;
  let freeAgents = inq;
  const n = { CHARACTER:0, RETINUE:0, REQUISITIONED:0 };
  al.forEach(u => { if (has(u, "DEDICATED TRANSPORT")) return;
    if (has(u, "INQUISITORIAL AGENTS") && freeAgents > 0) { freeAgents--; return; }
    if (has(u, "CHARACTER")) n.CHARACTER++; else if (has(u, "REQUISITIONED")) n.REQUISITIONED++; else if (has(u, "RETINUE")) n.RETINUE++; });
  Object.entries(n).forEach(([k, v]) => { if (v > cap[k]) bad(null, `Assigned Agents: ${v} ${k.toLowerCase()} unit${v === 1 ? "" : "s"}, but ${name} allows ${cap[k]}.`); });
  if (al.some(u => has(u, "DEDICATED TRANSPORT"))) bad(null, "Assigned Agents transports must start the battle with a unit embarked, or they count as destroyed.", false);
}
function validate0(l){
  const res = { total:0, errors:[], warnings:[], unitErr:{} };
  if (!D) return res;
  const bad = (u, msg, err=true) => { (err ? res.errors : res.warnings).push(msg); if (u && err) res.unitErr[u.uid] = true; };
  l.units.forEach(u => { res.total += unitCost(u) + enhCost(u); });
  if (res.total > l.points) bad(null, `Over the points limit by ${res.total - l.points} pts.`);
  if (!l.det) bad(null, "Pick a detachment.", false);
  const counts = {};
  l.units.forEach(u => counts[u.ds] = (counts[u.ds]||0)+1);
  for (const id in counts) {
    const mx = maxOf(id);
    if (counts[id] > mx) l.units.filter(u => u.ds === id).forEach((u,i) => { if (i >= mx) res.unitErr[u.uid] = true; }),
      res.errors.push(`${D.ds[id]?.name||"Unit"}: ${counts[id]} taken, maximum is ${mx}${mx===1?" (Epic Hero)":""}.`);
  }
  l.units.forEach(u => {
    if (!D.ds[u.ds]) bad(u, `"${u.name||"A unit"}" isn't in the imported data any more. Remove it or re-import.`);
    else if (!eligible(u.ds, l.army)) bad(u, `${D.ds[u.ds].name} can't be taken in a ${armyName(l.army, l)} army.`);
    if (D.ds[u.ds] && !costRows(u.ds).length) bad(u, `${D.ds[u.ds].name} has no points in the data.`, false);
  });
  const enhUnits = l.units.filter(u => u.enh);
  if (enhUnits.length > 3) bad(null, `${enhUnits.length} enhancements taken, maximum is 3.`);
  const seen = {};
  enhUnits.forEach(u => {
    const e = D.enhById[u.enh], k = D.kwSet[u.ds] || new Set();
    if (!e) { bad(u, `${unitLabel(l,u)} has an enhancement that isn't in the data.`); return; }
    if (seen[u.enh]) bad(u, `${e.name} is taken more than once.`);
    seen[u.enh] = true;
    if (!k.has("CHARACTER")) bad(u, `${unitLabel(l,u)} isn't a Character, so it can't take ${e.name}.`);
    if (k.has("EPIC HERO")) bad(u, `${unitLabel(l,u)} is an Epic Hero, so it can't take an enhancement.`);
    if (l.det && !matchDet(e, l.det)) bad(u, `${e.name} isn't from the ${l.det.name} detachment.`);
    const allow = D.enhDs[u.enh]; if (allow && allow.size && !allow.has(u.ds)) bad(u, `${unitLabel(l,u)} isn't allowed to take ${e.name}.`);
  });
  const leg = l.units.filter(u => D.ds[u.ds] && isLegends(u.ds));
  if (leg.length) res.warnings.push(`This list includes Legends units (${[...new Set(leg.map(u => D.ds[u.ds].name))].join(", ")}). They aren't allowed in most matched play events, so check with your opponent.`);
  const wl = l.units.filter(u => u.warlord);
  if (!wl.length && l.units.some(u => D.kwSet[u.ds]?.has("CHARACTER"))) bad(null, "Choose a Warlord.", false);
  if (wl.length > 1) bad(wl[1], "Only one model can be your Warlord.");
  wl.forEach(u => { if (!D.kwSet[u.ds]?.has("CHARACTER")) bad(u, `${unitLabel(l,u)} isn't a Character, so it can't be your Warlord.`); });
  const leaders = {};
  l.units.forEach(u => {
    if (!u.lead) return;
    const tgt = l.units.find(x => x.uid === u.lead);
    if (!tgt) { u.lead = null; return; }
    if (!(D.lead[u.ds]||[]).includes(tgt.ds)) bad(u, `${unitLabel(l,u)} can't lead ${unitLabel(l,tgt)}.`);
    (leaders[tgt.uid] ||= []).push(u);
  });
  for (const t in leaders) if (leaders[t].length > 1) {
    const tgt = l.units.find(x => x.uid === t);
    res.warnings.push(`${unitLabel(l,tgt)} has ${leaders[t].length} Leaders attached. Only some datasheets allow this, so check their Leader rules.`);
  }
  agentsCheck(l, bad);
  return res;
}
function listText(l){
  const v = validate(l), out = [];
  const sz = SIZES.find(s => s.pts === l.points);
  out.push(`${l.name}`);
  out.push(`${armyName(l.army, l)}${l.det ? " · " + l.det.name : ""}`);
  out.push(`${sz ? sz.name + " " : ""}(${l.points} pts) · ${v.total} pts used`);
  const groups = {};
  l.units.forEach(u => (groups[D.ds[u.ds] ? groupOf(u.ds, l.army) : "Other units"] ||= []).push(u));
  ROLE_ORDER.forEach(g => {
    if (!groups[g]) return;
    out.push("", catLabel(g, l.army).toUpperCase());
    groups[g].forEach(u => {
      const rows = costRows(u.ds), r = rows.find(x => x.line === u.line) || rows[0];
      out.push(`• ${unitLabel(l,u)}${r ? " (" + plain(r.label) + ")" : ""} — ${unitCost(u)+enhCost(u)} pts`);
      const extra = [];
      if (u.warlord) extra.push("Warlord");
      addonsOf(u).forEach(a => extra.push(`+ ${plain(a.label)} (+${a.cost})`));
      if (u.enh && D.enhById[u.enh]) extra.push(`Enhancement: ${D.enhById[u.enh].name} (+${enhCost(u)})`);
      if (u.lead) { const t = l.units.find(x => x.uid === u.lead); if (t) extra.push(`Leading: ${unitLabel(l,t)}`); }
      if (extra.length) out.push("   " + extra.join(" · "));
      wgPicks(u).forEach(p => out.push("   – " + (p.o.leader && p.o.choices.length ? (p.o.subject.match(LEADER_RE)||["Leader"])[0].replace(/^\w/, c => c.toUpperCase()) + ": " : "") + p.label));
      if (u.notes && u.notes.trim()) out.push("   Wargear: " + u.notes.trim().replace(/\s*\n\s*/g, "; "));
    });
  });
  if (l.notes && l.notes.trim()) out.push("", "NOTES", l.notes.trim());
  out.push("", "Built with Bear Bones Forge · data powered by Wahapedia");
  return out.join("\n");
}

/* Search: a unit matches by name, or by the name/text of its abilities, weapon abilities and keywords. Returns null (no match), "" (name match) or a hint. */

/* ============ odds + damage calculator (expected values) ============ */
function avgDice(v){ v = String(v || "").toUpperCase().replace(/\s/g, ""); let t = 0;
  v.split("+").forEach(part => { const m = part.match(/^(\d*)D(\d+)$/); if (m) t += (m[1] ? +m[1] : 1) * (+m[2] + 1) / 2; else t += num(part); }); return t; }

  k.blast = /\bblast\b/.test(d); k.heavy = /\bheavy\b/.test(d); k.lance = /\blance\b/.test(d); k.ignoresCover = /ignores cover/.test(d);

  const rf = d.match(/rapid fire (d?\d+)/); k.rapid = rf ? avgDice(rf[1]) : 0;
  [...d.matchAll(/anti-([a-z ]+?) (\d)\+/g)].forEach(m => k.anti.push({ kw:m[1].trim().toUpperCase(), n:+m[2] }));

}
function unitFnp(u){ const a = (D.abil[u.ds]||[]).find(x => /feel no pain/i.test(x.name || "") || /feel no pain/i.test(plain(x.description || "")));
  if (!a) return 0; const m = ((a.parameter || "") + " " + plain(a.description || "")).match(/(\d)\+/); return m ? +m[1] : 0; }

  return { name: D.ds[u.ds].name, t:num(m0.t), sv:num(m0.sv) || 7, inv:num(m0.inv_sv) || 0, w:Math.max(1, num(m0.w)), models:Math.max(1, alive), fnp:unitFnp(u), kw:D.kwSet[u.ds] || new Set() };
}
function woundNeed(S_, T){ return S_ >= 2*T ? 2 : S_ > T ? 3 : S_ === T ? 4 : 2*S_ <= T ? 6 : 5; }
function saveNeed(w, tg, cover, apPlus = 0, inv = 0){ const ap = Math.abs(num(w.ap)) + apPlus, k = weaponKw(w);
  let arm = tg.sv + ap; if (cover && !k.ignoresCover && !(tg.sv <= 3 && ap === 0)) arm -= 1;
